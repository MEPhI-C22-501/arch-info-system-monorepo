server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # redirects carry only the path: the container listens on 8080, the host publishes another port,
    # an absolute redirect would send the browser to the port of the container
    absolute_redirect off;

    # NFR-RM-35: static files are served with a strict policy, the page keeps scripts and styles in separate files
    # connect-src names the local Keycloak the browser gets its tokens from, another stand mounts its own copy of this file
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8183; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 302 /admin/;
    }

    # the interface lives under /admin/, the API of the service under /v1/ (routed by the ingress)
    location /admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /admin/index.html;
        # the browser revalidates every file by its ETag (a 304 when unchanged), so a new version of the panel
        # is never mixed with scripts of the previous one; expires keeps the security headers of the server block
        expires -1;
    }

    # the API of the service under the same origin, so the browser makes no cross-origin requests (NFR-RM-35);
    # the upstream is resolved per request through the Docker DNS, so nginx starts even when the service is not up yet
    location /v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reference_manager http://reference-manager:8080;
        proxy_pass $reference_manager;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
