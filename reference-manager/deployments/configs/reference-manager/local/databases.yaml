databases:
  postgres:
    host: reference-manager-database
    port: 5432
    # the account with data rights only, the password comes from POSTGRES_PASSWORD of the environment (K-08, K-12)
    user: reference_manager_app
    database: reference_manager

    connect_retry:
      enabled: true
      attempt_timeout: 5s
      initial_delay: 1s
      max_delay: 5s
      backoff_scale: 1.1

    pool:
      max_connections: 20
      min_connections: 2
      min_idle_connections: 2
      max_connection_lifetime: 1h
      max_connection_idle_time: 30m
      health_check_period: 1m
