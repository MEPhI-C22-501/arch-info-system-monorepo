auth:
  keycloak:
    # the issuer is the address clients get tokens from, it is set in Keycloak by KC_HOSTNAME
    issuer_url: http://localhost:8180/realms/arch-info-system
    # the service reaches Keycloak inside the compose network
    jwks_url: http://reference-manager-keycloak:8080/realms/arch-info-system/protocol/openid-connect/certs
    audience: reference-manager
    client_id: reference-manager

    algorithms: [ RS256 ]
    leeway: 30s

    jwks:
      refresh_interval: 1h
      unknown_key_refresh_interval: 1m
      request_timeout: 5s

    # the service client the accounts of employees are managed with (FR-RM-53..58),
    # its secret comes from KEYCLOAK_PROVISIONER_SECRET of the environment
    provisioner:
      client_id: reference-manager-provisioner
      request_timeout: 5s
      # realm roles of a new account: a new employee reads the shared classifiers and HR references
      default_realm_roles: [ reference-reader ]
