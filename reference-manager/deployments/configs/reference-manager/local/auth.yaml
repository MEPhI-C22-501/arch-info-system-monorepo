auth:
  keycloak:
    # the issuer is the address clients get tokens from, it is set in Keycloak by KC_HOSTNAME
    issuer_url: http://localhost:8180/realms/arch-info-system
    # the service reaches Keycloak inside the compose network
    jwks_url: http://reference-manager-keycloak:8080/realms/arch-info-system/protocol/openid-connect/certs
    audience: reference-manager
    client_id: reference-manager

    algorithms: [ RS256 ]
    leeway: 30s

    jwks:
      refresh_interval: 1h
      unknown_key_refresh_interval: 1m
      request_timeout: 5s
