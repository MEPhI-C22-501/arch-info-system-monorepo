telemetry:
  resource:
    service_name: reference-manager
    service_version: 0.0.0
    environment: local

  # traces, metrics and logs are sent over OTLP gRPC, an unavailable collector does not affect requests
  exporter:
    enabled: true
    endpoint: reference-manager-otel-collector:4317
    insecure: true
    timeout: 5s

  traces:
    sampling_ratio: 1

  metrics:
    export_interval: 15s

  log:
    level: debug
    format: text
