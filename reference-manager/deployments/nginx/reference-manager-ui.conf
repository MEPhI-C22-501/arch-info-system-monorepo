server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NFR-RM-35: static files are served with a strict policy, the page keeps scripts and styles in separate files
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / {
        return 302 /admin/;
    }

    # the interface lives under /admin/, the API of the service under /v1/ (routed by the ingress)
    location /admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
