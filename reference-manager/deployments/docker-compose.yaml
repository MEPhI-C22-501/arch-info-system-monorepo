services:
  reference-manager:
    container_name: reference_manager
    image: erp/reference-manager:dev
    build:
      context: ../backend
      dockerfile: ../deployments/docker/reference-manager.dockerfile

    command: [ "--configs", "/app/configs/reference-manager" ]

    # secrets come from .env only, the configuration files hold no passwords (NFR-RM-22)
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      KEYCLOAK_PROVISIONER_SECRET: ${KEYCLOAK_PROVISIONER_SECRET}

    ports:
      - "${REFERENCE_MANAGER_PORT:-8080}:8080"

    volumes:
      - ./configs/reference-manager/local/:/app/configs/reference-manager:ro

    depends_on:
      reference-manager-migrations:
        condition: service_completed_successfully
      reference-manager-keycloak:
        condition: service_healthy
      reference-manager-otel-collector:
        condition: service_started

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "/app/healthcheck", "-url", "http://127.0.0.1:8080/v1/health/readyz" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  reference-manager-migrations:
    container_name: reference_manager_migrations
    image: migrate/migrate:latest

    volumes:
      - ./migrations:/migrations:ro

    command: [ "-path=/migrations", "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@reference-manager-database:5432/${POSTGRES_DB}?sslmode=disable", "up" ]

    depends_on:
      reference-manager-database:
        condition: service_healthy

    restart: "no"

  # loads the demonstration data set, started by `task demo:data` only (profile demo)
  reference-manager-seed:
    container_name: reference_manager_seed
    image: postgres:18-alpine
    profiles: [ "demo" ]

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}

    command: [ "psql", "-v", "ON_ERROR_STOP=1", "-h", "reference-manager-database", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-f", "/seed/demo.sql" ]

    volumes:
      - ./seed/demo.sql:/seed/demo.sql:ro

    depends_on:
      reference-manager-migrations:
        condition: service_completed_successfully

    restart: "no"

  reference-manager-database:
    container_name: reference_manager_database
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # the account of the service, created by postgres/init with data rights only (K-08)
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - reference_manager_database_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reference_manager -d reference_manager" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # local Keycloak with the realm from keycloak/, on the shared stand Keycloak is provided by Infra
  reference-manager-keycloak:
    container_name: reference_manager_keycloak
    image: quay.io/keycloak/keycloak:26.7.4

    # the entry point writes the realm with the secret of the provisioner client, then starts Keycloak
    entrypoint: [ "/bin/bash", "/opt/keycloak/import-realm.sh" ]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # the issuer of the tokens, it has to match auth.keycloak.issuer_url of the service
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_PROVISIONER_SECRET: ${KEYCLOAK_PROVISIONER_SECRET}

    ports:
      - "8180:8080"

    volumes:
      - ./configs/keycloak/arch-info-system-realm.json:/opt/keycloak/realm-template/arch-info-system-realm.json:ro
      - ./configs/keycloak/import-realm.sh:/opt/keycloak/import-realm.sh:ro

    restart: unless-stopped

    healthcheck:
      # the image has no curl, so the management endpoint is requested through bash
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # local collector, it stores the received traces, metrics and logs in Elasticsearch,
  # on the shared stand the collector and the storage are provided by Infra
  reference-manager-otel-collector:
    container_name: reference_manager_otel_collector
    image: otel/opentelemetry-collector-contrib:0.161.0

    command: [ "--config=/etc/otelcol-contrib/config.yaml" ]

    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"

    volumes:
      - ./configs/otel-collector/local/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

    depends_on:
      reference-manager-elasticsearch:
        condition: service_healthy

    restart: unless-stopped

  # single node without security, for local development only
  reference-manager-elasticsearch:
    container_name: reference_manager_elasticsearch
    image: elasticsearch:9.5.5

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: "-Xms${ELASTICSEARCH_HEAP:-1g} -Xmx${ELASTICSEARCH_HEAP:-1g}"

    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"

    volumes:
      - reference_manager_elasticsearch_data:/usr/share/elasticsearch/data

    ulimits:
      memlock:
        soft: -1
        hard: -1

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "curl -sf 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  reference-manager-kibana:
    container_name: reference_manager_kibana
    image: kibana:9.5.5

    environment:
      ELASTICSEARCH_HOSTS: '["http://reference-manager-elasticsearch:9200"]'
      SERVER_PUBLICBASEURL: http://localhost:${KIBANA_PORT:-5601}

    ports:
      - "${KIBANA_PORT:-5601}:5601"

    depends_on:
      reference-manager-elasticsearch:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1:5601/api/status | grep -q '\"level\":\"available\"'" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # creates the data views of the logs, traces and metrics once Kibana is up
  reference-manager-kibana-setup:
    container_name: reference_manager_kibana_setup
    image: kibana:9.5.5

    entrypoint: [ "bash", "/setup/setup-data-views.sh" ]

    volumes:
      - ./configs/kibana/local/setup-data-views.sh:/setup/setup-data-views.sh:ro

    depends_on:
      reference-manager-kibana:
        condition: service_healthy

    restart: "no"

  reference-manager-ui:
    container_name: reference_manager_ui
    image: erp/reference-manager-ui:dev
    build:
      context: ../frontend
      dockerfile: ../deployments/docker/reference-manager-ui.dockerfile

    ports:
      - "${REFERENCE_MANAGER_UI_PORT:-8081}:8080"

    volumes:
      - ./configs/reference-manager-ui/local/reference-manager-ui.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  reference_manager_database_data:
  reference_manager_elasticsearch_data:
