services:
  reference-manager:
    container_name: reference_manager
    image: erp/reference-manager:dev

    build:
      context: ..
      dockerfile: deployments/docker/reference-manager.dockerfile

    command: [ "--configs", "/app/configs/reference-manager" ]

    ports:
      - "${REFERENCE_MANAGER_PORT:-8080}:8080"

    volumes:
      - ./configs/reference-manager/local/:/app/configs/reference-manager:ro

    depends_on:
      reference-manager-migrations:
        condition: service_completed_successfully

    restart: unless-stopped

  reference-manager-migrations:
    container_name: reference_manager_migrations
    image: migrate/migrate:latest

    volumes:
      - ./migrations:/migrations:ro

    command: [ "-path=/migrations", "-database=postgres://${REFERENCE_MANAGER_DB_USER}:${REFERENCE_MANAGER_DB_PASSWORD}@reference-manager-database:5432/${REFERENCE_MANAGER_DB_NAME}?sslmode=disable", "up" ]

    depends_on:
      reference-manager-database:
        condition: service_healthy

    restart: "no"

  reference-manager-database:
    container_name: reference_manager_database
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${REFERENCE_MANAGER_DB_NAME}
      POSTGRES_USER: ${REFERENCE_MANAGER_DB_USER}
      POSTGRES_PASSWORD: ${REFERENCE_MANAGER_DB_PASSWORD}

    ports:
      - "${REFERENCE_MANAGER_DB_PORT:-5432}:5432"

    volumes:
      - reference_manager_database_data:/var/lib/postgresql

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${REFERENCE_MANAGER_DB_USER} -d ${REFERENCE_MANAGER_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.7.4

    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-database:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - ./configs/keycloak:/opt/keycloak/data/import:ro

    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"

    depends_on:
      keycloak-database:
        condition: service_healthy

    restart: unless-stopped

  keycloak-database:
    container_name: keycloak_database
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - keycloak_database_data:/var/lib/postgresql

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  reference_manager_database_data:
  keycloak_database_data:
