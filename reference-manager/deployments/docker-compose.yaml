services:
  reference-manager:
    container_name: reference_manager
    image: erp/reference-manager:dev
    build:
      context: ../backend
      dockerfile: ../deployments/docker/reference-manager.dockerfile

    command: [ "--configs", "/app/configs/reference-manager" ]

    ports:
      - "${REFERENCE_MANAGER_PORT:-8080}:8080"

    volumes:
      - ./configs/reference-manager/local/:/app/configs/reference-manager:ro

    depends_on:
      reference-manager-migrations:
        condition: service_completed_successfully
      reference-manager-keycloak:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "/app/healthcheck", "-url", "http://127.0.0.1:8080/v1/health/readyz" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  reference-manager-migrations:
    container_name: reference_manager_migrations
    image: migrate/migrate:latest

    volumes:
      - ./migrations:/migrations:ro

    command: [ "-path=/migrations", "-database=postgres://reference_manager:reference_manager@reference-manager-database:5432/reference_manager?sslmode=disable", "up" ]

    depends_on:
      reference-manager-database:
        condition: service_healthy

    restart: "no"

  reference-manager-database:
    container_name: reference_manager_database
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - reference_manager_database_data:/var/lib/postgresql

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reference_manager -d reference_manager" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # local Keycloak with the realm from keycloak/, on the shared stand Keycloak is provided by Infra
  reference-manager-keycloak:
    container_name: reference_manager_keycloak
    image: quay.io/keycloak/keycloak:26.7.4

    command: [ "start-dev", "--import-realm" ]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # the issuer of the tokens, it has to match auth.keycloak.issuer_url of the service
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"

    ports:
      - "8180:8080"

    volumes:
      - ./configs/keycloak/arch-info-system-realm.json:/opt/keycloak/data/import/arch-info-system-realm.json:ro

    restart: unless-stopped

    healthcheck:
      # the image has no curl, so the management endpoint is requested through bash
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  reference-manager-ui:
    container_name: reference_manager_ui
    image: erp/reference-manager-ui:dev
    build:
      context: ../frontend
      dockerfile: ../deployments/docker/reference-manager-ui.dockerfile

    ports:
      - "${REFERENCE_MANAGER_UI_PORT:-8081}:8080"

    volumes:
      - ./configs/reference-manager-ui/local/reference-manager-ui.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  reference_manager_database_data:
