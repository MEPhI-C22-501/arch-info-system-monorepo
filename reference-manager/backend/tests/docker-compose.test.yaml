# test environment of the integration tests, it is started by testcontainers from tests/infra
# host ports are ephemeral, the tests read them from the started containers, so several runs do not conflict
# the database has no volume, so every run starts with a clean state
name: reference-manager-tests

services:
  reference-manager:
    image: erp/reference-manager:test
    build:
      context: ..
      dockerfile: ../deployments/docker/reference-manager.dockerfile

    command: [ "--configs", "/app/configs/reference-manager" ]

    ports:
      - "8080"

    volumes:
      - ../../deployments/configs/reference-manager/local/:/app/configs/reference-manager:ro

    depends_on:
      reference-manager-migrations:
        condition: service_completed_successfully

    healthcheck:
      test: [ "CMD", "/app/healthcheck", "-url", "http://127.0.0.1:8080/v1/health/readyz" ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  reference-manager-migrations:
    image: migrate/migrate:latest

    volumes:
      - ../../deployments/migrations:/migrations:ro

    command: [ "-path=/migrations", "-database=postgres://reference_manager:reference_manager@reference-manager-database:5432/reference_manager?sslmode=disable", "up" ]

    depends_on:
      reference-manager-database:
        condition: service_healthy

    restart: "no"

  reference-manager-database:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: reference_manager
      POSTGRES_USER: reference_manager
      POSTGRES_PASSWORD: reference_manager

    ports:
      - "5432"

    tmpfs:
      - /var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reference_manager -d reference_manager" ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
