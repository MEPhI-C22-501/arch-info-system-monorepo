# test environment of the integration tests, it is started by testcontainers from tests/infra
# host ports are ephemeral, the tests read them from the started containers, so several runs do not conflict
# the database has no volume, so every run starts with a clean state
# the users of the Keycloak realm are the actors of the scenarios
name: reference-manager-tests

services:
  reference-manager:
    image: erp/reference-manager:test
    # always rebuild, otherwise compose reuses a stale image left by a previous run
    pull_policy: build
    build:
      context: ..
      dockerfile: ../deployments/docker/reference-manager.dockerfile

    command: [ "--configs", "/app/configs/reference-manager" ]

    ports:
      - "8080"

    volumes:
      - ../../deployments/configs/reference-manager/local/:/app/configs/reference-manager:ro

    depends_on:
      reference-manager-migrations:
        condition: service_completed_successfully
      reference-manager-keycloak:
        condition: service_healthy
      reference-manager-otel-collector:
        condition: service_started

    healthcheck:
      test: [ "CMD", "/app/healthcheck", "-url", "http://127.0.0.1:8080/v1/health/readyz" ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  reference-manager-migrations:
    image: migrate/migrate:latest

    volumes:
      - ../../deployments/migrations:/migrations:ro

    command: [ "-path=/migrations", "-database=postgres://reference_manager:reference_manager@reference-manager-database:5432/reference_manager?sslmode=disable", "up" ]

    depends_on:
      reference-manager-database:
        condition: service_healthy

    restart: "no"

  # dev mode with the realm imported on startup, the realm is shared with the local environment
  reference-manager-keycloak:
    image: quay.io/keycloak/keycloak:26.7.4

    command: [ "start-dev", "--import-realm" ]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # the issuer stays the same as in the local environment, whatever host port the tests get tokens from
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"

    ports:
      - "8080"

    volumes:
      - ../../deployments/configs/keycloak/arch-info-system-realm.json:/opt/keycloak/data/import/arch-info-system-realm.json:ro

    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3" ]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  # the service exports its telemetry here, the collector only prints it, Elasticsearch is not started for the tests
  reference-manager-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0

    command: [ "--config=/etc/otelcol-contrib/config.yaml" ]

    volumes:
      - ../../deployments/configs/otel-collector/test/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  reference-manager-database:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: reference_manager
      POSTGRES_USER: reference_manager
      POSTGRES_PASSWORD: reference_manager

    ports:
      - "5432"

    tmpfs:
      - /var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reference_manager -d reference_manager" ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
