openapi: 3.1.0

info:
  title: Reference Manager Currency API
  description: API endpoints for currency lifecycle management according to ISO 4217.
  version: 1.0.0

security:
  - KeycloakOAuth2: [currencies:read]

paths:
  /v1/currencies/:
    post:
      operationId: createCurrency 
      summary: Create new currency record
      description: >
        Create a new currency record in accordance with the ISO 4217 standard.
        The currency will be created with revision number 1 and initial metadata.
      security:
        - KeycloakOAuth2: [currencies:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Currency'
            example:
              code: "USD"
              number: "840"
              name: "US Dollar"
              decimals: 2
      responses:
        '201':
          $ref: '#/components/responses/SuccessWithExpandedCurrency'
        '400':
          description: Bad Request. Invalid input data, validation errors, or malformed request body.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client is authenticated but lacks the necessary permissions to create a currency.
          $ref: '#/components/responses/Error'
        '409':
          description: Conflict. A currency with the provided code or number already exists.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error. An unexpected error occurred on the server while processing the request.
          $ref: '#/components/responses/Error'
        '503':
          description: Service Unavailable. The server is temporarily unable to handle the request due to maintenance or overload.
          $ref: '#/components/responses/Error'
        '504':
          description: Gateway Timeout. The server did not receive a timely response from an upstream service.
          $ref: '#/components/responses/Error'

    get:
      operationId: listCurrencies
      summary: List currencies with pagination
      parameters:
        - $ref: '#/components/parameters/ListPageSize'
        - $ref: '#/components/parameters/ListPageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/AllowDeleted'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedCurrencies'
        '400':
          description: Bad Request. Invalid input data, validation errors, or malformed request body.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client is authenticated but lacks the necessary permissions to create a currency.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error. An unexpected error occurred on the server while processing the request.
          $ref: '#/components/responses/Error'
        '503':
          description: Service Unavailable. The server is temporarily unable to handle the request due to maintenance or overload.
          $ref: '#/components/responses/Error'
        '504':
          description: Gateway Timeout. The server did not receive a timely response from an upstream service.
          $ref: '#/components/responses/Error'     

  /v1/currencies/export:
    post:
      operationId: exportCurrencies
      summary: Export currencies in Excel format
      description: Generates and returns an Excel file containing the list of currencies
      security:
        - KeycloakOAuth2: [currencies:export]
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExcelFile'
        '400':
          description: Bad Request. Invalid input data, validation errors, or malformed request body.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client is authenticated but lacks the necessary permissions to create a currency.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error. An unexpected error occurred on the server while processing the request.
          $ref: '#/components/responses/Error'
        '503':
          description: Service Unavailable. The server is temporarily unable to handle the request due to maintenance or overload.
          $ref: '#/components/responses/Error'
        '504':
          description: Gateway Timeout. The server did not receive a timely response from an upstream service.
          $ref: '#/components/responses/Error'

  /v1/currencies/{currencyID}:
    get: 
      operationId: getCurrency
      summary: Get currency by ID
      description: >
        Retrieve detailed information about a specific currency by its unique identifier.
        Returns the current state of the currency including revision history metadata.
      parameters:
        - $ref: '#/components/parameters/CurrencyID'
        - $ref: '#/components/parameters/AllowDeleted'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedCurrency'
        '400':
          description: Bad Request. Invalid currency ID format or malformed query parameters.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client is authenticated but lacks the necessary permissions to view this currency.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The requested currency does not exist or has been permanently deleted.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error. An unexpected error occurred on the server while processing the request.
          $ref: '#/components/responses/Error'
        '503':
          description: Service Unavailable. The server is temporarily unable to handle the request due to maintenance or overload.
          $ref: '#/components/responses/Error'
        '504':
          description: Gateway Timeout. The server did not receive a timely response from an upstream service.
          $ref: '#/components/responses/Error'   

    patch:
      operationId: updateCurrency
      summary: Update currency information
      description: >
        Partially update currency information. Only provided fields will be updated.
        A new revision will be created with the changes applied.
      parameters:
        - $ref: "#/components/parameters/CurrencyID"
        - $ref: '#/components/parameters/UpdateMask'
      security:
        - KeycloakOAuth2: [currencies:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Currency'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedCurrency'
        '400':
          description: Bad Request. Invalid input data, validation errors, or malformed update mask.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client is authenticated but lacks the necessary permissions to update this currency.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The requested currency does not exist or has been permanently deleted.
          $ref: '#/components/responses/Error'
        '409':
          description: Conflict. Optimistic concurrency failure (e.g., the currency was modified by another process since the last read).
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error. An unexpected error occurred on the server while processing the request.
          $ref: '#/components/responses/Error'
        '503':
          description: Service Unavailable. The server is temporarily unable to handle the request due to maintenance or overload.
          $ref: '#/components/responses/Error'
        '504':
          description: Gateway Timeout. The server did not receive a timely response from an upstream service.
          $ref: '#/components/responses/Error'

    delete:
      operationId: deleteCurrency
      summary: Delete currency record
      description: >
        Permanently delete a currency record from the system.
        This action cannot be undone. All associated revision history will also be removed.
      parameters:
        - $ref: "#/components/parameters/CurrencyID"
        - $ref: '#/components/parameters/Force'
      security:
        -  KeycloakOAuth2: [currencies:delete]
      responses:
        '204':
          $ref: '#/components/responses/SuccessWithExpandedCurrency'
        '400':
          description: Bad Request. Invalid currency ID format or malformed query parameters.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client is authenticated but lacks the necessary permissions to delete this currency.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The requested currency does not exist or has already been permanently deleted.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error. An unexpected error occurred on the server while processing the request.
          $ref: '#/components/responses/Error'
        '503':
          description: Service Unavailable. The server is temporarily unable to handle the request due to maintenance or overload.
          $ref: '#/components/responses/Error'
        '504':
          description: Gateway Timeout. The server did not receive a timely response from an upstream service.
          $ref: '#/components/responses/Error'

  /v1/currencies/{currencyID}/revisions:
    get:
      operationId: listCurrencyRevisions
      summary: List all revisions for a currency
      description: >
        Retrieve the complete revision history for a specific currency.
        Returns all revisions in chronological order, showing what changes were made,
        when they were made, and by whom.
      parameters:
        - $ref: '#/components/parameters/CurrencyID'
        - $ref: '#/components/parameters/ListPageSize'
        - $ref: '#/components/parameters/ListPageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/AllowDeleted'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithCurrencyRevisionList'
        '400':
          description: Bad Request. Invalid query parameters, pagination errors, or malformed filters.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client is authenticated but lacks the necessary permissions to view revision history.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The requested currency does not exist.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error. An unexpected error occurred on the server while processing the request.
          $ref: '#/components/responses/Error'
        '503':
          description: Service Unavailable. The server is temporarily unable to handle the request due to maintenance or overload.
          $ref: '#/components/responses/Error'
        '504':
          description: Gateway Timeout. The server did not receive a timely response from an upstream service.
          $ref: '#/components/responses/Error'

  /v1/currencies/{currencyID}/revisions/{revisionNumber}:
    get:
      operationId: getCurrencyRevision
      summary: Get specific revision of a currency
      description: >
        Retrieve detailed information about a specific revision of a currency.
        Shows the exact state of the currency at that revision point and the changes applied.
      parameters:
        - $ref: '#/components/parameters/CurrencyID'
        - $ref: '#/components/parameters/RevisionNumber'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithCurrencyRevisionList'
        '400':
          description: Bad Request. Invalid currency ID or revision number format.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client is authenticated but lacks the necessary permissions to view this revision.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The requested currency or the specific revision number does not exist.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error. An unexpected error occurred on the server while processing the request.
          $ref: '#/components/responses/Error'
        '503':
          description: Service Unavailable. The server is temporarily unable to handle the request due to maintenance or overload.
          $ref: '#/components/responses/Error'
        '504':
          description: Gateway Timeout. The server did not receive a timely response from an upstream service.
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    KeycloakOAuth2:
      type: oauth2
      description: >
        Authentication via Keycloak (OAuth 2.0 / OpenID Connect). 
        Pass the JWT access token in the Authorization header (Bearer <token>).
      flows:
        authorizationCode:
          authorizationUrl: https://keycloak.your-domain.com/realms/your_realm/protocol/openid-connect/auth
          tokenUrl: https://keycloak.your-domain.com/realms/your_realm/protocol/openid-connect/token
          scopes:
            currencies:read: Read currency data and revision history
            currencies:write: Create and update currency records
            currencies:delete: Permanently delete currency records
            currencies:export: Export currencies to Excel format
        clientCredentials:
          tokenUrl: https://keycloak.your-domain.com/realms/your_realm/protocol/openid-connect/token
          scopes:
            currencies:read: Read currency data and revision history
            currencies:write: Create and update currency records
            currencies:delete: Permanently delete currency records
            currencies:export: Export currencies to Excel format

  schemas:
    Error:
      type: object
      description: Standardized error response format for all API errors.
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error message describing what went wrong.
          example: "Validation failed"
        details:
          type: array
          description: >
            Optional array of detailed error information.
            Can include field-specific validation errors or additional context.
          items:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            - field: "code"
              message: "Must be exactly 3 uppercase letters"

    ErrorDetail:
      type: object
      description: Detailed information about a specific error or validation issue.
      properties:
        field:
          type: string
          description: The field name that caused the error (if applicable).
          example: "code"
        message:
          type: string
          description: Specific error message for this field or detail.
          example: "Must be exactly 3 uppercase letters"

    Currency:
      type: object
      description: >
        Currency information in accordance with the ISO 4217 standard.
        Includes alphabetic and numeric codes, the name, and rounding precision.
      required:
        - code
        - number
        - name
        - decimals
      properties:
        code:
          type: string
          description: >
            Three-letter international currency code (alphabetic code).
            Always consists of three uppercase Latin letters.
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: "USD"
        number:
          type: string
          description: >
            Three-digit numeric currency code. 
            Passed as a string to preserve leading zeros (e.g., '840' for USD).
          minLength: 3
          maxLength: 3
          pattern: '^\d{3}$'
          example: "840"
        name:
          type: string
          description: Official name of the currency in Russian or English.
          example: "US Dollar"
        decimals:
          type: integer
          description: >
            The number of decimal places (minor units) for fractional parts (cents, kopecks).
            Usually 2, but there are exceptions (e.g., 0 for JPY or 3 for BHD).
          minimum: 0
          maximum: 4
          example: 2
        is_deleted:
          type: boolean
          description: Indicates whether the currency record has been soft-deleted.
          default: false
          example: false

    CurrencyRevision:
      type: object
      description: Currency revision record reflecting changes made to currency data. This model is read-only.
      required:
        - id
        - currency_id
        - revision_number
        - change
        - changed_by
        - changed_at
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the revision record.
          readOnly: true
          example: 1024
        currency_id:
          type: integer
          format: int64
          description: Identifier of the currency this revision belongs to (references ISO 4217 standard currency data).
          readOnly: true
          example: 840
        revision_number:
          type: integer
          description: The sequential number of the revision, starting from 1.
          readOnly: true
          example: 3
        change:
          type: array
          description: Changes applied in this revision relative to the previous one, formatted as a JSON Patch (RFC 6902).
          readOnly: true
          items:
            type: object
          example:
            - op: "replace"
              path: "/name"
              value: "US Dollar"
        changed_by:
          type: string
          format: uuid
          description: UUID of the user or system component that performed the change.
          readOnly: true
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        changed_at:
          type: string
          format: date-time
          description: The date and time when the change was applied.
          readOnly: true
          example: "2026-10-05T07:54:00Z"

    ExpandedCurrency:
      type: object
      description: >
        Currency information in accordance with the ISO 4217 standard.
        Includes alphabetic and numeric codes, the name, and rounding precision.
      required:
        - code
        - number
        - name
        - decimals
        - revision
        - last_changer
        - created_at
        - updated_at
      properties:
        code:
          type: string
          description: >
            Three-letter international currency code (alphabetic code).
            Always consists of three uppercase Latin letters.
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: "USD"
        number:
          type: string
          description: >
            Three-digit numeric currency code. 
            Passed as a string to preserve leading zeros (e.g., '840' for USD).
          minLength: 3
          maxLength: 3
          pattern: '^\d{3}$'
          example: "840"
        name:
          type: string
          description: Official name of the currency in Russian or English.
          example: "US Dollar"
        decimals:
          type: integer
          description: >
            The number of decimal places (minor units) for fractional parts (cents, kopecks).
            Usually 2, but there are exceptions (e.g., 0 for JPY or 3 for BHD).
          minimum: 0
          maximum: 4
          example: 2
        revision:
          type: integer
          description: The sequential number of the latest revision applied to this currency.
          example: 3
        last_changer:
          type: string
          format: uuid
          description: UUID of the user or system component that performed the latest change.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        is_deleted:
          type: boolean
          description: Indicates whether the currency record has been soft-deleted.
          default: false
          example: false
        created_at:
          type: string
          format: date-time
          description: The date and time when the currency record was initially created.
          example: "2023-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: The date and time when the currency record was last updated.
          example: "2026-10-05T07:54:00Z"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: The date and time when the currency record was soft-deleted. Null if the record is active.
          example: null

  parameters:
    CurrencyID:
      name: currencyID
      in: path
      description: >
        Unique identifier of the currency record.
        Must be a positive integer.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 840

    ListPageSize:
      name: pageSize
      in: query
      description: Number of elements per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 50

    ListPageToken:
      name: pageToken
      in: query
      description: > 
        Pagination token for retrieving the next page of results.
        Use the token from the previous response to get the next page.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: "^[a-zA-Z0-9_-]+$"
        example: "eyJwYWdlIjoyLCJsaW1pdCI6NTB9"
  
    UpdateMask:
      name: updateMask
      in: query
      required: false
      description: >
        Fields to be updated. A comma-separated string of paths to the fields (e.g., `title,author.bio`). 
        If the parameter is omitted or set to `*`, all fields passed in the request body are updated.
      schema:
        type: string
        example: "title,author.bio"

    Force:
      name: force
      in: query
      required: false
      description: >
        If set to `true`, the action will be forced, bypassing 
        certain validation rules or the resource's lock state.
      schema:
        type: boolean
        default: false

    AllowDeleted:
      name: allowDeleted
      in: query
      required: false
      description: >
        If set to `true`, allows reading, modifying, or interacting with resources that have been marked as deleted.
      schema:
        type: boolean
        default: false

    Filter:
      name: filter
      in: query
      required: false
      description: >
        An expression for filtering results. It supports comparison operators (=, !=, <, >, <=, >=), logical operators (AND, OR, NOT),
        and containment checks (e.g., `status = "ACTIVE" AND author.name : "John"`).
      schema:
        type: string
        example: 'status = "ACTIVE" AND price < 100'

    OrderBy:
      name: order_by
      in: query
      required: false
      description: >
        A comma-separated list of sort fields. Ascending order (asc) is used by default. To change the direction,
        use the `desc` suffix (e.g., `author.name desc, title`).
      schema:
        type: string
        example: 'author.name desc, title asc'

    RevisionNumber:
      name: revisionNumber
      in: path
      description: >
        The sequential number of the revision, starting from 1.
        Must be a positive integer.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 3

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Validation failed"
            details:
              - field: "code"
                message: "Must be exactly 3 uppercase letters"
              - field: "number"
                message: "Must be exactly 3 digits"

    SuccessWithExpandedCurrency:
      description: Successful response with expanded currency information
      content: 
        application/json:
          schema:
            $ref: '#/components/schemas/ExpandedCurrency'
          example:
            code: "USD"
            number: "840"
            name: "US Dollar"
            decimals: 2
            revision: 1
            last_changer: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
            created_at: "2026-10-05T07:54:00Z"
            updated_at: "2026-10-05T07:54:00Z"

    SuccessWithExpandedCurrencies:
      description: Successful response with list of expanded currency information
      content:
        application/json:
          schema:
            type: object
            properties:
              currencies:
                type: array
                description: List of currencies
                items:
                  $ref: '#/components/schemas/ExpandedCurrency'
              nextPageToken:
                type: string
                description: Token to retrieve the next page
                example: "next_page_token_value"

    SuccessWithCurrencyRevision:
      description: Successful response with information about currency revision
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrencyRevision'
          example:
            id: 1003
            currency_id: 840
            revision_number: 3
            change:
              - op: "replace"
                path: "/name"
                value: "US Dollar"
            changed_by: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
            changed_at: "2026-10-05T07:54:00Z"
    
    SuccessWithCurrencyRevisionList:
      description: Successful response with information about currency revisions
      content:
        application/json:
          schema:
            type: object
            properties:
              currencies:
                type: array
                description: List of currency revisions
                items:
                  $ref: '#/components/schemas/CurrencyRevision'
              nextPageToken:
                type: string
                description: Token to retrieve the next page
                example: "next_page_token_value"

    SuccessWithExcelFile:
      description: The file has been successfully generated and is ready for download.
      headers:
        Content-Disposition:
          schema:
            type: string
          example: 'attachment; filename="report_2023.xlsx"'
          description: >
            A header instructing the browser to download the file as an attachment with a specified name.
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary