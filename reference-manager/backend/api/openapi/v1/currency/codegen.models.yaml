package: currencyv1

generate:
  models: true
  
output-options:
  skip-prune: false
  type-mapping:
    string:
      formats:
        uuid:
          type: uuid.UUID
          import: github.com/google/uuid

additional-imports:
  - package: github.com/google/uuid
  
output: pkg/api/v1/currency/models.gen.go