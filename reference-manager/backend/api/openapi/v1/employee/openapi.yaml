openapi: 3.1.0

# generated by tools/gencatalog from the catalog definition, do not edit by hand

info:
  title: Reference Manager Employee API
  description: "HR profiles of employees. The unit and the position come from the assignment in effect today."
  version: 1.0.0

security:
  - KeycloakOAuth2: []

paths:
  /v1/employees/:
    post:
      operationId: createEmployee
      summary: Create a new employee
      description: Creates a employee with revision number 1.
      x-required-roles: [reference-hr-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '201':
          $ref: '#/components/responses/SuccessWithExpandedEmployee'
        '400':
          description: Bad Request. Invalid input data, validation errors with details per field, or a malformed request body.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to create a employee.
          $ref: '#/components/responses/Error'
        '409':
          description: Conflict. A employee with the same unique values already exists.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

    get:
      operationId: listEmployees
      x-required-roles: [reference-reader, reference-hr-reader, reference-admin, reference-hr-admin]
      summary: List employees with pagination
      parameters:
        - $ref: '#/components/parameters/ListPageSize'
        - $ref: '#/components/parameters/ListPageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/AllowDeleted'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedEmployees'
        '400':
          description: Bad Request. Invalid filter, ordering or page token.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to read employees.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

  /v1/employees/export:
    post:
      operationId: exportEmployees
      summary: Export employees in Excel format
      description: Generates and returns an Excel file with all active employees in creation order.
      x-required-roles: [reference-reader, reference-hr-reader, reference-admin, reference-hr-admin]
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExcelFile'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to export employees.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

  /v1/employees/{employeeID}:
    get:
      operationId: getEmployee
      x-required-roles: [reference-reader, reference-hr-reader, reference-admin, reference-hr-admin]
      summary: Get a employee by ID
      description: Returns the current state of the employee with its revision metadata.
      parameters:
        - $ref: '#/components/parameters/EmployeeID'
        - $ref: '#/components/parameters/AllowDeleted'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedEmployee'
        '400':
          description: Bad Request. Invalid identifier or query parameters.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to read employees.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The employee does not exist or is deleted and deleted records were not allowed.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

    patch:
      operationId: updateEmployee
      summary: Update a employee
      description: Partially updates the employee, only the fields of the update mask change. A new revision records the difference.
      parameters:
        - $ref: '#/components/parameters/EmployeeID'
        - $ref: '#/components/parameters/UpdateMask'
      x-required-roles: [reference-hr-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedEmployee'
        '400':
          description: Bad Request. Invalid input data, validation errors with details per field, or a malformed update mask.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to update employees.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The employee does not exist or is deleted.
          $ref: '#/components/responses/Error'
        '409':
          description: Conflict. Unique values are taken, or the employee was modified concurrently.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

    delete:
      operationId: deleteEmployee
      summary: Delete a employee
      description: >
        Soft-deletes the employee: the record is marked as deleted and a new revision is created.
        With `force=true` the record is permanently deleted together with its revision history.
      parameters:
        - $ref: '#/components/parameters/EmployeeID'
        - $ref: '#/components/parameters/Force'
      x-required-roles: [reference-hr-admin]
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedEmployee'
        '204':
          description: No Content. The employee has been permanently deleted with `force=true`.
        '400':
          description: Bad Request. Invalid identifier or query parameters.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to delete employees.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The employee does not exist or has already been deleted.
          $ref: '#/components/responses/Error'
        '409':
          description: Conflict. The employee was modified concurrently.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

  /v1/employees/{employeeID}/dismiss:
    post:
      operationId: dismissEmployee
      summary: Dismiss an employee
      description: "Sets the employment state to DISMISSED with the dismissal date and closes the assignment and the salary in effect with that date. A dismissed employee cannot be dismissed again."
      x-required-roles: [reference-hr-admin]
      parameters:
        - $ref: '#/components/parameters/EmployeeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDismissal'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedEmployee'
        '400':
          description: Bad Request. Invalid input data or the operation is not allowed in the current state.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required for the operation.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The employee does not exist or is deleted.
          $ref: '#/components/responses/Error'
        '409':
          description: Conflict. The employee was modified concurrently.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

  /v1/employees/{employeeID}/syncAccount:
    post:
      operationId: syncEmployeeAccount
      summary: Repeat the pending operation with the Keycloak account
      description: "Brings the Keycloak account in line with the record: creates it when it is missing, enables it while the employee works, disables it after the dismissal and passes the names and the email. Safe to repeat, a second account is never created (FR-RM-56)."
      x-required-roles: [reference-hr-admin]
      parameters:
        - $ref: '#/components/parameters/EmployeeID'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedEmployee'
        '400':
          description: Bad Request. Invalid input data or the operation is not allowed in the current state.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required for the operation.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The employee does not exist or is deleted.
          $ref: '#/components/responses/Error'
        '409':
          description: Conflict. The employee was modified concurrently.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

  /v1/employees/{employeeID}/revisions:
    get:
      operationId: listEmployeeRevisions
      x-required-roles: [reference-reader, reference-hr-reader, reference-admin, reference-hr-admin]
      summary: List the revisions of a employee
      description: Returns the revision history of the employee page by page.
      parameters:
        - $ref: '#/components/parameters/EmployeeID'
        - $ref: '#/components/parameters/ListPageSize'
        - $ref: '#/components/parameters/ListPageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/AllowDeleted'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithEmployeeRevisionList'
        '400':
          description: Bad Request. Invalid query parameters, pagination errors, or malformed filters.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to read employees.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The employee does not exist.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

  /v1/employees/{employeeID}/revisions/{revisionNumber}:
    get:
      operationId: getEmployeeRevision
      x-required-roles: [reference-reader, reference-hr-reader, reference-admin, reference-hr-admin]
      summary: Get a revision of a employee
      description: Returns one revision of the employee with the changes it applied.
      parameters:
        - $ref: '#/components/parameters/EmployeeID'
        - $ref: '#/components/parameters/RevisionNumber'
        - $ref: '#/components/parameters/AllowDeleted'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithEmployeeRevision'
        '400':
          description: Bad Request. Invalid identifier or revision number.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to read employees.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The employee or the revision does not exist.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    KeycloakOAuth2:
      type: oauth2
      description: >
        Authentication via Keycloak (OAuth 2.0 / OpenID Connect), realm arch-info-system.
        Pass the access token in the Authorization header (Bearer <token>). The token has to be issued
        for the reference-manager audience. Access is granted by the realm roles (or the roles of the
        reference-manager client) listed in x-required-roles of each operation, any of them is enough.
        A request without a valid token gets 401, a token without a required role gets 403.
        The URLs below point to the local environment.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8180/realms/arch-info-system/protocol/openid-connect/auth
          tokenUrl: http://localhost:8180/realms/arch-info-system/protocol/openid-connect/token
          scopes: {}
        clientCredentials:
          tokenUrl: http://localhost:8180/realms/arch-info-system/protocol/openid-connect/token
          scopes: {}

  schemas:
    Error:
      type: object
      description: Standardized error response format for all API errors.
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error message describing what went wrong.
          example: "validation failed"
        details:
          type: array
          description: Optional field-specific errors.
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      description: Detailed information about a specific error or validation issue.
      properties:
        field:
          type: string
          description: The field name that caused the error (if applicable).
          example: "code"
        message:
          type: string
          description: Specific error message for this field or detail.
          example: "must match ^[a-z][a-z0-9-]{1,63}$"

    EmploymentState:
      type: string
      description: "EMPLOYED until the employee is dismissed."
      enum:
        - EMPLOYED
        - DISMISSED

    AccountState:
      type: string
      description: "State of the Keycloak account: PENDING until the last operation with the account is confirmed, ENABLED while the employee works, DISABLED after the dismissal (FR-RM-55)."
      enum:
        - PENDING
        - ENABLED
        - DISABLED

    Employee:
      type: object
      description: The fields of a employee a client sets on creation and update.
      required:
        - personnel_number
        - family_name
        - given_name
        - email
        - username
        - hire_date
      properties:
        personnel_number:
          type: string
          minLength: 1
          maxLength: 10
          pattern: '^[0-9]{1,10}$'
          description: "Personnel number, 1 to 10 digits."
          example: "1024"
        family_name:
          type: string
          maxLength: 100
          description: "Family name."
          example: "Ivanov"
        given_name:
          type: string
          maxLength: 100
          description: "Given name."
          example: "Ivan"
        middle_name:
          type: string
          maxLength: 100
          description: "Middle name, when present."
          example: "Ivanovich"
        email:
          type: string
          maxLength: 254
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: "Work email address."
          example: "i.ivanov@example.org"
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-z][a-z0-9._-]{2,63}$'
          description: "Login in Keycloak, cannot be changed after creation."
          example: "i.ivanov"
        hire_date:
          type: string
          format: date
          description: "Date of hire."
          example: "2026-10-01"

    ExpandedEmployee:
      type: object
      description: A employee with its identifier and the lifecycle derived from its revisions.
      required:
        - id
        - personnel_number
        - family_name
        - given_name
        - email
        - username
        - hire_date
        - employment_state
        - account_state
        - is_deleted
        - revision
        - last_changer
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          type: integer
          format: int64
          description: Identifier of the employee, assigned by the service.
          example: 1
        personnel_number:
          type: string
          minLength: 1
          maxLength: 10
          pattern: '^[0-9]{1,10}$'
          description: "Personnel number, 1 to 10 digits."
          example: "1024"
        family_name:
          type: string
          maxLength: 100
          description: "Family name."
          example: "Ivanov"
        given_name:
          type: string
          maxLength: 100
          description: "Given name."
          example: "Ivan"
        middle_name:
          type: string
          maxLength: 100
          description: "Middle name, when present."
          example: "Ivanovich"
        email:
          type: string
          maxLength: 254
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: "Work email address."
          example: "i.ivanov@example.org"
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-z][a-z0-9._-]{2,63}$'
          description: "Login in Keycloak, cannot be changed after creation."
          example: "i.ivanov"
        hire_date:
          type: string
          format: date
          description: "Date of hire."
          example: "2026-10-01"
        employment_state:
          $ref: '#/components/schemas/EmploymentState'
        dismissal_date:
          type: string
          format: date
          description: "Date of dismissal, set by the dismissal. Read-only, set by the service."
          example: "2026-10-31"
        org_unit_id:
          type: integer
          format: int64
          minimum: 1
          description: "Identifier of the unit from the assignment in effect today, filled by migration 000011. Read-only, set by the service."
          example: 1
        position_id:
          type: integer
          format: int64
          minimum: 1
          description: "Identifier of the position from the assignment in effect today, filled by migration 000011. Read-only, set by the service."
          example: 1
        account_state:
          $ref: '#/components/schemas/AccountState'
        account_user_id:
          type: string
          maxLength: 36
          description: "Identifier of the Keycloak account, the sub claim of its tokens. Empty until the account is created, kept after the dismissal. Read-only, set by the service."
          example: "9b2f1c4e-6d3a-4b8e-9f10-2a7c5d8e1b34"
        is_deleted:
          type: boolean
          description: Indicates whether the record has been soft-deleted.
          example: false
        revision:
          type: integer
          format: int32
          description: The sequential number of the latest revision applied to this record.
          example: 1
        last_changer:
          type: string
          format: uuid
          description: UUID of the user or system component that performed the latest change.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        created_at:
          type: string
          format: date-time
          description: The date and time when the record was created.
          example: "2026-10-05T07:54:00Z"
        updated_at:
          type: string
          format: date-time
          description: The date and time when the record was last changed.
          example: "2026-10-05T07:54:00Z"
        deleted_at:
          type: string
          format: date-time
          description: The date and time of the soft deletion, the zero time (0001-01-01T00:00:00Z) if the record has never been deleted.
          example: "0001-01-01T00:00:00Z"

    EmployeeRevision:
      type: object
      description: One change of a employee. This model is read-only.
      required:
        - id
        - employee_id
        - revision_number
        - change
        - changed_by
        - changed_at
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the revision record.
          readOnly: true
          example: 1024
        employee_id:
          type: integer
          format: int64
          description: Identifier of the employee this revision belongs to.
          readOnly: true
          example: 1
        revision_number:
          type: integer
          format: int32
          description: The sequential number of the revision, starting from 1.
          readOnly: true
          example: 3
        change:
          type: array
          description: Changes applied in this revision relative to the previous one, formatted as a JSON Patch (RFC 6902).
          readOnly: true
          items:
            type: object
        changed_by:
          type: string
          format: uuid
          description: UUID of the user or system component that performed the change.
          readOnly: true
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        changed_at:
          type: string
          format: date-time
          description: The date and time when the change was applied.
          readOnly: true
          example: "2026-10-05T07:54:00Z"

    EmployeeDismissal:
      type: object
      required:
        - dismissal_date
      properties:
        dismissal_date:
          type: string
          format: date
          description: Last day of employment, not earlier than the hire date.
          example: "2026-10-31"

  parameters:
    EmployeeID:
      name: employeeID
      in: path
      description: Identifier of the employee, a positive integer.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

    ListPageSize:
      name: pageSize
      in: query
      description: Number of elements per page.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
        example: 50

    ListPageToken:
      name: pageToken
      in: query
      description: Pagination token from the previous response.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: "^[a-zA-Z0-9_-]+$"

    UpdateMask:
      name: updateMask
      in: query
      required: false
      description: >
        Comma-separated list of the fields to update. If the parameter is omitted or set to `*`,
        all updatable fields passed in the request body are updated.
      schema:
        type: string
        example: "name"

    Force:
      name: force
      in: query
      required: false
      description: If set to `true`, the record is permanently deleted together with its revisions.
      schema:
        type: boolean
        default: false

    AllowDeleted:
      name: allowDeleted
      in: query
      required: false
      description: If set to `true`, soft-deleted records are included.
      schema:
        type: boolean
        default: false

    Filter:
      name: filter
      in: query
      required: false
      description: >
        An AIP-160 expression for filtering results. It supports comparison operators (=, !=, <, >, <=, >=),
        logical operators (AND, OR, NOT) and containment checks (`name : "team"`). Dates are compared as `YYYY-MM-DD` strings.
      schema:
        type: string
        example: 'is_deleted = false'

    OrderBy:
      name: order_by
      in: query
      required: false
      description: >
        A comma-separated list of sort fields. Ascending order is used by default. To change the direction,
        use the `desc` suffix (e.g., `created_at desc, id`).
      schema:
        type: string
        example: 'created_at desc'

    RevisionNumber:
      name: revisionNumber
      in: path
      description: The sequential number of the revision, starting from 1.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 3

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    SuccessWithExpandedEmployee:
      description: Successful response with the expanded employee
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpandedEmployee'

    SuccessWithExpandedEmployees:
      description: Successful response with a page of expanded employees
      content:
        application/json:
          schema:
            type: object
            properties:
              employees:
                type: array
                description: Page of employees
                items:
                  $ref: '#/components/schemas/ExpandedEmployee'
              nextPageToken:
                type: string
                description: Token to retrieve the next page, absent on the last page
                example: "next_page_token_value"

    SuccessWithEmployeeRevision:
      description: Successful response with one revision of a employee
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmployeeRevision'

    SuccessWithEmployeeRevisionList:
      description: Successful response with a page of revisions of a employee
      content:
        application/json:
          schema:
            type: object
            properties:
              revisions:
                type: array
                description: Page of revisions
                items:
                  $ref: '#/components/schemas/EmployeeRevision'
              nextPageToken:
                type: string
                description: Token to retrieve the next page, absent on the last page
                example: "next_page_token_value"

    SuccessWithExcelFile:
      description: The file has been successfully generated and is ready for download.
      headers:
        Content-Disposition:
          schema:
            type: string
          example: 'attachment; filename="employees.xlsx"'
          description: Instructs the browser to download the file as an attachment with the given name.
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
