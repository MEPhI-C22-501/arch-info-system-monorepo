version: '3'

# entry point for the whole module, run `task` from reference-manager/
# layout: backend/ (Go service), frontend/ (administration interface),
# deployments/ (Dockerfiles, Compose, configs, migrations of both parts)

vars:
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend
  DOCKERFILES_DIR: deployments/docker
  IMAGE_REGISTRY: erp
  IMAGE_TAG: latest
  IMAGES:
    map:
      reference-manager: '{{.BACKEND_DIR}}'
      reference-manager-ui: '{{.FRONTEND_DIR}}'

tasks:
  generate:
    desc: Generate the catalog specs, domains, handlers and migrations, then the API code from every OpenAPI spec
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - go run ./tools/gencatalog
      - |
        find api/openapi -name "openapi.yaml" -type f | while read file; do
          dir=$(dirname "$file")

          configs=("codegen.server.yaml" "codegen.models.yaml" "codegen.client.yaml")

          for config_name in "${configs[@]}"; do
            config="$dir/$config_name"
            if [ -f "$config" ]; then
              echo "Generating from $file with config $config_name"
              go tool oapi-codegen -config "$config" "$file"
            fi
          done
        done

  lint:
    desc: Run all linters checks (pass extra flags after '--', e.g., 'task lint -- --fix')
    cmds:
      - task: lint:backend
      - task: lint:docker
      - task: api:check

  lint:backend:
    desc: Run golangci-lint on the backend
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - golangci-lint run ./... {{.CLI_ARGS}}

  lint:docker:
    desc: Run hadolint on the Dockerfiles of all images
    cmds:
      - for: { var: IMAGES }
        cmd: docker run --rm -i ghcr.io/hadolint/hadolint:latest < {{.DOCKERFILES_DIR}}/{{.KEY}}.dockerfile

  # the shared api/ folder of the monorepo keeps copies of the specs of the module and the clients generated from
  # them for every team, the specs here are the source: api:sync copies them, api:check fails on a stale copy
  api:sync:
    desc: Copy the specs of the module into the shared api/ folder, then regenerate its clients there ('task generate' in api/)
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - |
        for spec in api/openapi/v1/*/openapi.yaml; do
          name=$(basename "$(dirname "$spec")")
          target="../../api/openapi/reference-manager/$name/openapi.yaml"
          if [ "$name" = currency ]; then target="../../api/openapi/reference-manager/currency/v1/openapi.yaml"; fi
          mkdir -p "$(dirname "$target")"
          cp "$spec" "$target"
        done

  api:check:
    desc: Fail when the shared api/ folder holds another version of a spec of the module
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - |
        stale=0
        for spec in api/openapi/v1/*/openapi.yaml; do
          name=$(basename "$(dirname "$spec")")
          target="../../api/openapi/reference-manager/$name/openapi.yaml"
          if [ "$name" = currency ]; then target="../../api/openapi/reference-manager/currency/v1/openapi.yaml"; fi
          if ! cmp -s "$spec" "$target"; then echo "stale copy: $target, run 'task api:sync'"; stale=1; fi
        done
        exit $stale

  tests:
    desc: Run all tests
    cmds:
      - task: tests:backend
      - task: tests:frontend

  tests:backend:
    desc: Run backend unit tests
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - go test ./...

  tests:integration:
    desc: Run backend integration tests, the environment from docker-compose.test.yaml is started by testcontainers
    dir: '{{.BACKEND_DIR}}'
    cmds:
      # a single package, with a package list go test buffers the output until the package finishes even with -v
      - go test -v -tags integration -count=1 ./tests {{.CLI_ARGS}}

  tests:frontend:
    desc: Run the unit tests of the admin panel (Node 18+, no dependencies)
    cmds:
      - node --test {{.FRONTEND_DIR}}/admin/tests/*.test.js

  tests:e2e:
    desc: Run the browser tests of the admin panel against the running environment ('task up' first, not in CI)
    dir: '{{.FRONTEND_DIR}}/e2e'
    cmds:
      - npm ci --no-audit --no-fund
      # the browser comes from 'npx playwright install chromium' or from E2E_CHROMIUM, a Chromium already on the machine
      - npx playwright test {{.CLI_ARGS}}

  migration:
    desc: Create new migration file
    cmds:
      - migrate create -ext sql -dir deployments/migrations -seq {{.CLI_ARGS}}

  build:
    desc: Build all Docker images of the module (pass extra 'docker build' flags after '--', e.g., 'task build -- --no-cache')
    cmds:
      - for: { var: IMAGES }
        task: build:{{.KEY}}

  build:*:
    desc: Build one Docker image by its name, e.g., 'task build:reference-manager-ui'
    vars:
      NAME: '{{index .MATCH 0}}'
    preconditions:
      - sh: '{{if hasKey .IMAGES .NAME}}true{{else}}false{{end}}'
        msg: 'unknown image "{{.NAME}}", available: {{.IMAGES | keys | sortAlpha | join ", "}}'
    cmds:
      - >-
        docker build {{.CLI_ARGS}}
        -f {{.DOCKERFILES_DIR}}/{{.NAME}}.dockerfile
        -t {{.IMAGE_REGISTRY}}/{{.NAME}}:{{.IMAGE_TAG}}
        {{index .IMAGES .NAME}}

  env:
    desc: Create deployments/.env from deployments/.env.example when it is missing
    status:
      - test -f deployments/.env
    cmds:
      - cp deployments/.env.example deployments/.env

  up:
    desc: Start the local development environment using Docker Compose
    deps: [ env ]
    cmds:
      - docker compose -f deployments/docker-compose.yaml up -d --build

  down:
    desc: Stop the local environment and remove associated volumes
    deps: [ env ]
    cmds:
      - docker compose -f deployments/docker-compose.yaml --profile swagger down -v

  demo:
    desc: Load the demonstration data set and create the Keycloak accounts of its employees (after 'task up')
    cmds:
      - task: demo:data
      - task: demo:accounts

  demo:data:
    desc: Load deployments/seed/demo.sql into the running local database (task up does it too), skipped when employees exist
    deps: [ env ]
    cmds:
      - docker compose -f deployments/docker-compose.yaml run --rm reference-manager-seed

  demo:accounts:
    desc: Create or repeat the Keycloak accounts of every employee through the API as hr-admin (task up does it too)
    deps: [ env ]
    cmds:
      - docker compose -f deployments/docker-compose.yaml run --rm reference-manager-demo-accounts {{.CLI_ARGS}}

  swagger:
    desc: Start Swagger UI of all specs on SWAGGER_PORT (8089) next to the running environment, it logs in through the local Keycloak
    deps: [ env ]
    cmds:
      - docker compose -f deployments/docker-compose.yaml --profile swagger up -d reference-manager-swagger
      - echo "Swagger UI: http://localhost:${SWAGGER_PORT:-8089}/, Authorize logs in as a user of the local realm"
