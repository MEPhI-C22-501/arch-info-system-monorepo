version: '3'

# entry point for the whole module, run `task` from reference-manager/
# layout: backend/ (Go service), frontend/ (administration interface),
# deployments/ (Dockerfiles, Compose, configs, migrations of both parts)

vars:
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend
  BACKEND_DOCKERFILE: deployments/docker/reference-manager.dockerfile
  BACKEND_IMAGE: erp/reference-manager:latest
  FRONTEND_DOCKERFILE: deployments/docker/reference-manager-ui.dockerfile
  FRONTEND_IMAGE: erp/reference-manager-ui:latest

tasks:
  generate:
    desc: Generate backend artifacts from the OpenAPI specs (server, models, client)
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - |
        find api/openapi -name "openapi.yaml" -type f | while read file; do
          dir=$(dirname "$file")

          configs=("codegen.server.yaml" "codegen.models.yaml" "codegen.client.yaml")

          for config_name in "${configs[@]}"; do
            config="$dir/$config_name"
            if [ -f "$config" ]; then
              echo "Generating from $file with config $config_name"
              go tool oapi-codegen -config "$config" "$file"
            fi
          done
        done

  lint:
    desc: Run all linters checks (pass extra flags after '--', e.g., 'task lint -- --fix')
    cmds:
      - task: lint:backend
      - task: lint:docker

  lint:backend:
    desc: Run golangci-lint on the backend
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - golangci-lint run ./... {{.CLI_ARGS}}

  lint:docker:
    desc: Run hadolint on the Dockerfiles of the backend and the frontend
    cmds:
      - docker run --rm -i ghcr.io/hadolint/hadolint:latest < {{.BACKEND_DOCKERFILE}}
      - docker run --rm -i ghcr.io/hadolint/hadolint:latest < {{.FRONTEND_DOCKERFILE}}

  tests:
    desc: Run all tests
    cmds:
      - task: tests:backend
      - task: tests:frontend

  tests:backend:
    desc: Run backend tests
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - echo "not implemented"

  tests:frontend:
    desc: Run the unit tests of the admin panel (Node 18+, no dependencies)
    cmds:
      - node --test {{.FRONTEND_DIR}}/admin/tests/*.test.js

  migration:
    desc: Create new migration file
    cmds:
      - migrate create -ext sql -dir deployments/migrations -seq {{.CLI_ARGS}}

  build:
    desc: Build Docker images of the module
    cmds:
      - task: build:backend
      - task: build:frontend

  build:backend:
    desc: Build the backend Docker image
    cmds:
      - docker build -f {{.BACKEND_DOCKERFILE}} -t {{.BACKEND_IMAGE}} {{.BACKEND_DIR}}

  build:frontend:
    desc: Build the frontend Docker image (nginx with the admin panel under /admin/)
    cmds:
      - docker build -f {{.FRONTEND_DOCKERFILE}} -t {{.FRONTEND_IMAGE}} .

  up:
    desc: Start the local development environment using Docker Compose
    cmds:
      - docker compose -f deployments/docker-compose.yaml up -d --build

  down:
    desc: Stop the local environment and remove associated volumes
    cmds:
      - docker compose -f deployments/docker-compose.yaml down -v

  swagger:
    desc: Start Swagger UI in Docker for all discovered openapi.yaml specs
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - |
        URLS_JSON="["
        for file in $(find api/openapi -name "openapi.yaml"); do
          rel_path=${file#api/openapi/}
          name=$(dirname "$rel_path")
          URLS_JSON="${URLS_JSON}{\"url\":\"api/${rel_path}\",\"name\":\"${name}\"},"
        done
        URLS_JSON="${URLS_JSON%,}]"

        echo -e "Swagger UI is running at: http://localhost:8080 \n"

        docker run --rm \
          -p 8080:8080 \
          -v "$(pwd)/api/openapi:/usr/share/nginx/html/api" \
          -e URLS_PRE_FILTER="true" \
          -e URLS="$URLS_JSON" \
          --name swagger_ui \
          swaggerapi/swagger-ui
