openapi: 3.1.0

info:
  title: Reference Manager Currency API
  description: API endpoints for currency lifecycle management according to ISO 4217.
  version: 1.0.0

paths:
  /v1/currencies/:
    post:
      operationId: createCurrency 
      summary: Create new currency record
      description: >
        Create a new currency record in accordance with the ISO 4217 standard.
        The currency will be created with revision number 1 and initial metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Currency'
            example:
              code: "USD"
              number: "840"
              name: "US Dollar"
              decimals: 2
      responses:
        '201':
          $ref: '#/components/responses/CurrencyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      summary: List currencies with pagination
      parameters:
        - $ref: '#/components/parameters/ListPageSize'
        - $ref: '#/components/parameters/ListPageToken'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  currencies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Currency'
                  nextPageToken:
                    type: string
                    description: Token to retrieve the next page
                    example: "next_page_token_value"

  /v1/currencies/{currencyID}:
    get: 
      operationId: getCurrency
      summary: Get currency by ID
      description: >
        Retrieve detailed information about a specific currency by its unique identifier.
        Returns the current state of the currency including revision history metadata.
      parameters:
        - $ref: '#/components/parameters/CurrencyID'
      responses:
        '200':
          description: Currency found and returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandedCurrency'
              example:
                code: "USD"
                number: "840"
                name: "US Dollar"
                decimals: 2
                revision: 3
                last_changer: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                created_at: "2023-01-01T00:00:00Z"
                updated_at: "2026-10-05T07:54:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateCurrency
      summary: Update currency information
      description: >
        Partially update currency information. Only provided fields will be updated.
        A new revision will be created with the changes applied.
      parameters:
        - $ref: "#/components/parameters/CurrencyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyUpdate'
            example:
              name: "United States Dollar"
              decimals: 2
      responses:
        '200':
          description: Currency successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandedCurrency'
              example:
                code: "USD"
                number: "840"
                name: "United States Dollar"
                decimals: 2
                revision: 4
                last_changer: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                created_at: "2023-01-01T00:00:00Z"
                updated_at: "2026-10-05T08:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteCurrency
      summary: Delete currency record
      description: >
        Permanently delete a currency record from the system.
        This action cannot be undone. All associated revision history will also be removed.
      parameters:
        - $ref: "#/components/parameters/CurrencyID"
      responses:
        '204':
          description: Currency successfully deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Error:
      type: object
      description: Standardized error response format for all API errors.
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          description: >
            Machine-readable error code that identifies the type of error.
            Uses UPPER_SNAKE_CASE format for consistency.
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error message describing what went wrong.
          example: "Validation failed"
        details:
          type: array
          description: >
            Optional array of detailed error information.
            Can include field-specific validation errors or additional context.
          items:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            - field: "code"
              message: "Must be exactly 3 uppercase letters"

    ErrorDetail:
      type: object
      description: Detailed information about a specific error or validation issue.
      properties:
        field:
          type: string
          description: The field name that caused the error (if applicable).
          example: "code"
        message:
          type: string
          description: Specific error message for this field or detail.
          example: "Must be exactly 3 uppercase letters"
        value:
          type: string
          description: The invalid value that was provided (if applicable).
          example: "usd"
        constraint:
          type: string
          description: The validation constraint that was violated (if applicable).
          example: "pattern"

    Currency:
      type: object
      description: >
        Currency information in accordance with the ISO 4217 standard.
        Includes alphabetic and numeric codes, the name, and rounding precision.
      required:
        - code
        - number
        - name
        - decimals
      properties:
        code:
          type: string
          description: >
            Three-letter international currency code (alphabetic code).
            Always consists of three uppercase Latin letters.
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: "USD"
        number:
          type: string
          description: >
            Three-digit numeric currency code. 
            Passed as a string to preserve leading zeros (e.g., '840' for USD).
          minLength: 3
          maxLength: 3
          pattern: '^\d{3}$'
          example: "840"
        name:
          type: string
          description: Official name of the currency in Russian or English.
          example: "US Dollar"
        decimals:
          type: integer
          description: >
            The number of decimal places (minor units) for fractional parts (cents, kopecks).
            Usually 2, but there are exceptions (e.g., 0 for JPY or 3 for BHD).
          minimum: 0
          maximum: 4
          example: 2

    CurrencyRevision:
      type: object
      description: Currency revision record reflecting changes made to currency data. This model is read-only.
      required:
        - id
        - currency_id
        - revision_number
        - change
        - changed_by
        - changed_at
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the revision record.
          readOnly: true
          example: 1024
        currency_id:
          type: integer
          format: int64
          description: Identifier of the currency this revision belongs to (references ISO 4217 standard currency data).
          readOnly: true
          example: 840
        revision_number:
          type: integer
          description: The sequential number of the revision, starting from 1.
          readOnly: true
          example: 3
        change:
          type: array
          description: Changes applied in this revision relative to the previous one, formatted as a JSON Patch (RFC 6902).
          readOnly: true
          items:
            type: object
          example:
            - op: "replace"
              path: "/name"
              value: "US Dollar"
        changed_by:
          type: string
          format: uuid
          description: UUID of the user or system component that performed the change.
          readOnly: true
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        changed_at:
          type: string
          format: date-time
          description: The date and time when the change was applied.
          readOnly: true
          example: "2026-10-05T07:54:00Z"

    ExpandedCurrency:
      type: object
      description: >
        Currency information in accordance with the ISO 4217 standard.
        Includes alphabetic and numeric codes, the name, and rounding precision.
      required:
        - code
        - number
        - name
        - decimals
        - revision
        - last_changer
        - created_at
        - updated_at
      properties:
        code:
          type: string
          description: >
            Three-letter international currency code (alphabetic code).
            Always consists of three uppercase Latin letters.
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: "USD"
        number:
          type: string
          description: >
            Three-digit numeric currency code. 
            Passed as a string to preserve leading zeros (e.g., '840' for USD).
          minLength: 3
          maxLength: 3
          pattern: '^\d{3}$'
          example: "840"
        name:
          type: string
          description: Official name of the currency in Russian or English.
          example: "US Dollar"
        decimals:
          type: integer
          description: >
            The number of decimal places (minor units) for fractional parts (cents, kopecks).
            Usually 2, but there are exceptions (e.g., 0 for JPY or 3 for BHD).
          minimum: 0
          maximum: 4
          example: 2
        revision:
          type: integer
          description: The sequential number of the latest revision applied to this currency.
          example: 3
        last_changer:
          type: string
          format: uuid
          description: UUID of the user or system component that performed the latest change.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        created_at:
          type: string
          format: date-time
          description: The date and time when the currency record was initially created.
          example: "2023-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: The date and time when the currency record was last updated.
          example: "2026-10-05T07:54:00Z"

  parameters:
    CurrencyID:
      name: currencyID
      in: path
      description: >
        Unique identifier of the currency record.
        Must be a positive integer.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 840

    ListPageSize:
      name: pageSize
      in: query
      description: Number of elements per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 50

    ListPageToken:
      name: pageToken
      in: query
      description: > 
        Pagination token for retrieving the next page of results.
        Use the token from the previous response to get the next page.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: "^[a-zA-Z0-9_-]+$"
        example: "eyJwYWdlIjoyLCJsaW1pdCI6NTB9"
  
  responses:
    CurrencyCreated:
      description: Currency successfully created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpandedCurrency'
          example:
            code: "USD"
            number: "840"
            name: "US Dollar"
            decimals: 2
            revision: 1
            last_changer: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
            created_at: "2026-10-05T07:54:00Z"
            updated_at: "2026-10-05T07:54:00Z"

    BadRequest:
      description: Invalid request data (validation error)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation_error:
              summary: Validation error
              value:
                error_code: "VALIDATION_ERROR"
                message: "Validation failed"
                details:
                  - field: "code"
                    message: "Must be exactly 3 uppercase letters"
                  - field: "number"
                    message: "Must be exactly 3 digits"

    Conflict:
      description: Currency already exists (conflict on code or number)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            duplicate_currency:
              summary: Duplicate currency
              value:
                error_code: "DUPLICATE_CURRENCY"
                message: "Currency with this code already exists"
                details:
                  - field: "code"
                    message: "Currency code 'USD' is already in use"

    UnprocessableEntity:
      description: Unprocessable entity (business logic validation failed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            business_logic_error:
              summary: Business logic error
              value:
                error_code: "BUSINESS_LOGIC_ERROR"
                message: "Invalid currency configuration"
                details: []

    NotFound:
      description: Currency not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            currency_not_found:
              summary: Currency not found
              value:
                error_code: "NOT_FOUND"
                message: "Currency with the specified ID was not found"
                details:
                  - field: "currencyID"
                    message: "No currency exists with ID 999"
