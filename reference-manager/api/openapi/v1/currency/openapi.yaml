openapi: 3.1.0

info:
  title: Reference Manager Currency API
  description: API endpoints for currency lifecycle management according to ISO 4217.
  version: 1.0.0

paths:
  /v1/currencies/:
    post:
      operationId: createCurrency 
      summary: Create new currency record
      description: >
        Create a new currency record in accordance with the ISO 4217 standard.
        The currency will be created with revision number 1 and initial metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Currency'
            example:
              code: "USD"
              number: "840"
              name: "US Dollar"
              decimals: 2
      responses:
        '201':
          $ref: '#/components/responses/CurrencyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      summary: List currencies with pagination
      parameters:
        - $ref: '#/components/parameters/ListPageSize'
        - $ref: '#/components/parameters/ListPageToken'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  currencies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Currency'
                  nextPageToken:
                    type: string
                    description: Token to retrieve the next page
                    example: "next_page_token_value"

  /v1/currencies/{currencyID}:
    get: 
      operationId: getCurrency
      summary: Get currency by ID
      description: >
        Retrieve detailed information about a specific currency by its unique identifier.
        Returns the current state of the currency including revision history metadata.
      parameters:
        - $ref: '#/components/parameters/CurrencyID'
      responses:
        '200':
          description: Currency found and returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandedCurrency'
              example:
                code: "USD"
                number: "840"
                name: "US Dollar"
                decimals: 2
                revision: 3
                last_changer: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                created_at: "2023-01-01T00:00:00Z"
                updated_at: "2026-10-05T07:54:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateCurrency
      summary: Update currency information
      description: >
        Partially update currency information. Only provided fields will be updated.
        A new revision will be created with the changes applied.
      parameters:
        - $ref: "#/components/parameters/CurrencyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyUpdate'
            example:
              name: "United States Dollar"
              decimals: 2
      responses:
        '200':
          description: Currency successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandedCurrency'
              example:
                code: "USD"
                number: "840"
                name: "United States Dollar"
                decimals: 2
                revision: 4
                last_changer: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                created_at: "2023-01-01T00:00:00Z"
                updated_at: "2026-10-05T08:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteCurrency
      summary: Delete currency record
      description: >
        Permanently delete a currency record from the system.
        This action cannot be undone. All associated revision history will also be removed.
      parameters:
        - $ref: "#/components/parameters/CurrencyID"
      responses:
        '204':
          description: Currency successfully deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/currencies/import:
    post:
      operationId: importCurrencies
      summary: Import currencies from Excel file
      description: >
        Bulk import currency records from an Excel file.
        The file should contain columns matching the Currency schema fields.
        Each row will be validated and imported as a new currency record.
        If any validation errors occur, the entire import will be rejected.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel file (.xlsx or .xls) containing currency data
                validateOnly:
                  type: boolean
                  default: false
                  description: >
                    If true, only validate the file without importing.
                    Returns validation results without creating records.
            examples:
              import_file:
                summary: Import currencies from Excel
                value:
                  file: "currencies.xlsx"
                  validateOnly: false
      responses:
        '200':
          description: Currencies successfully imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported_count:
                    type: integer
                    description: Number of currencies successfully imported
                    example: 150
                  skipped_count:
                    type: integer
                    description: Number of currencies skipped (duplicates or invalid)
                    example: 5
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportError'
                    description: List of validation errors for skipped rows
              example:
                imported_count: 148
                skipped_count: 2
                errors:
                  - row: 3
                    field: "code"
                    message: "Invalid currency code format"
                    value: "usd"
                  - row: 7
                    field: "number"
                    message: "Currency number already exists"
                    value: "840"
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: "FILE_TOO_LARGE"
                message: "File size exceeds maximum limit of 10MB"
        '415':
          description: Unsupported file format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: "UNSUPPORTED_FORMAT"
                message: "Only .xlsx and .xls files are supported"
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/currencies/export:
    post:
      operationId: exportCurrencies
      summary: Export currencies to Excel file
      description: >
        Export currency records to an Excel file.
        Supports filtering by various criteria and selecting specific fields.
        Returns the file as a downloadable attachment.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  properties:
                    codes:
                      type: array
                      items:
                        type: string
                      description: Filter by specific currency codes
                      example: ["USD", "EUR", "RUB"]
                    created_after:
                      type: string
                      format: date-time
                      description: Filter currencies created after this date
                      example: "2023-01-01T00:00:00Z"
                    updated_after:
                      type: string
                      format: date-time
                      description: Filter currencies updated after this date
                      example: "2026-09-01T00:00:00Z"
                fields:
                  type: array
                  items:
                    type: string
                    enum: ["code", "number", "name", "decimals", "revision", "created_at", "updated_at"]
                  description: >
                    Fields to include in the export.
                    If not specified, all fields will be included.
                  example: ["code", "number", "name", "decimals"]
                format:
                  type: string
                  enum: ["xlsx", "csv"]
                  default: "xlsx"
                  description: Output file format
            example:
              filters:
                codes: ["USD", "EUR"]
              fields: ["code", "number", "name", "decimals"]
              format: "xlsx"
      responses:
        '200':
          description: Export file generated successfully
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/currencies/{currencyID}/revisions:
    get:
      operationId: listCurrencyRevisions
      summary: List all revisions for a currency
      description: >
        Retrieve the complete revision history for a specific currency.
        Returns all revisions in chronological order, showing what changes were made,
        when they were made, and by whom.
      parameters:
        - $ref: '#/components/parameters/CurrencyID'
        - name: pageSize
          in: query
          description: Number of revisions per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 10
        - name: pageToken
          in: query
          description: Pagination token for retrieving the next page
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Revisions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency_id:
                    type: integer
                    description: ID of the currency these revisions belong to
                    example: 840
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/CurrencyRevision'
                  total_count:
                    type: integer
                    description: Total number of revisions for this currency
                    example: 5
                  nextPageToken:
                    type: string
                    description: Token to retrieve the next page of revisions
              example:
                currency_id: 840
                revisions:
                  - id: 1001
                    currency_id: 840
                    revision_number: 1
                    change: []
                    changed_by: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    changed_at: "2023-01-01T00:00:00Z"
                  - id: 1002
                    currency_id: 840
                    revision_number: 2
                    change:
                      - op: "replace"
                        path: "/name"
                        value: "United States Dollar"
                    changed_by: "4fb96g75-6828-5673-c4gd-3d074g77bgb7"
                    changed_at: "2024-06-15T10:30:00Z"
                  - id: 1003
                    currency_id: 840
                    revision_number: 3
                    change:
                      - op: "replace"
                        path: "/name"
                        value: "US Dollar"
                    changed_by: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    changed_at: "2026-10-05T07:54:00Z"
                total_count: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/currencies/{currencyID}/revisions/{revisionNumber}:
    get:
      operationId: getCurrencyRevision
      summary: Get specific revision of a currency
      description: >
        Retrieve detailed information about a specific revision of a currency.
        Shows the exact state of the currency at that revision point and the changes applied.
      parameters:
        - $ref: '#/components/parameters/CurrencyID'
        - name: revisionNumber
          in: path
          description: The sequential revision number to retrieve
          required: true
          schema:
            type: integer
            minimum: 1
            example: 3
      responses:
        '200':
          description: Revision retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/CurrencyRevision'
                  currency_state:
                    $ref: '#/components/schemas/Currency'
                    description: >
                      The state of the currency at this revision point.
                      Shows what the currency looked like after this revision was applied.
              example:
                revision:
                  id: 1003
                  currency_id: 840
                  revision_number: 3
                  change:
                    - op: "replace"
                      path: "/name"
                      value: "US Dollar"
                  changed_by: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  changed_at: "2026-10-05T07:54:00Z"
                currency_state:
                  code: "USD"
                  number: "840"
                  name: "US Dollar"
                  decimals: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Currency or revision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                currency_not_found:
                  summary: Currency not found
                  value:
                    error_code: "NOT_FOUND"
                    message: "Currency with the specified ID was not found"
                revision_not_found:
                  summary: Revision not found
                  value:
                    error_code: "REVISION_NOT_FOUND"
                    message: "Revision 5 does not exist for currency 840"
                    details:
                      - field: "revisionNumber"
                        message: "Requested revision is out of range"

components:
  schemas:
    Error:
      type: object
      description: Standardized error response format for all API errors.
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          description: >
            Machine-readable error code that identifies the type of error.
            Uses UPPER_SNAKE_CASE format for consistency.
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error message describing what went wrong.
          example: "Validation failed"
        details:
          type: array
          description: >
            Optional array of detailed error information.
            Can include field-specific validation errors or additional context.
          items:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            - field: "code"
              message: "Must be exactly 3 uppercase letters"

    ErrorDetail:
      type: object
      description: Detailed information about a specific error or validation issue.
      properties:
        field:
          type: string
          description: The field name that caused the error (if applicable).
          example: "code"
        message:
          type: string
          description: Specific error message for this field or detail.
          example: "Must be exactly 3 uppercase letters"
        value:
          type: string
          description: The invalid value that was provided (if applicable).
          example: "usd"
        constraint:
          type: string
          description: The validation constraint that was violated (if applicable).
          example: "pattern"

    ImportError:
      type: object
      description: Details about an error encountered during currency import.
      properties:
        row:
          type: integer
          description: Row number in the Excel file where the error occurred
          example: 3
        field:
          type: string
          description: Field that caused the validation error
          example: "code"
        message:
          type: string
          description: Human-readable error message
          example: "Invalid currency code format"
        value:
          type: string
          description: The invalid value that was provided
          example: "usd"

    Currency:
      type: object
      description: >
        Currency information in accordance with the ISO 4217 standard.
        Includes alphabetic and numeric codes, the name, and rounding precision.
      required:
        - code
        - number
        - name
        - decimals
      properties:
        code:
          type: string
          description: >
            Three-letter international currency code (alphabetic code).
            Always consists of three uppercase Latin letters.
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: "USD"
        number:
          type: string
          description: >
            Three-digit numeric currency code. 
            Passed as a string to preserve leading zeros (e.g., '840' for USD).
          minLength: 3
          maxLength: 3
          pattern: '^\d{3}$'
          example: "840"
        name:
          type: string
          description: Official name of the currency in Russian or English.
          example: "US Dollar"
        decimals:
          type: integer
          description: >
            The number of decimal places (minor units) for fractional parts (cents, kopecks).
            Usually 2, but there are exceptions (e.g., 0 for JPY or 3 for BHD).
          minimum: 0
          maximum: 4
          example: 2

    CurrencyUpdate:
      type: object
      description: >
        Schema for partial updates to currency information.
        All fields are optional since this is used for PATCH operations.
        Only provided fields will be updated.
      properties:
        code:
          type: string
          description: >
            Three-letter international currency code (alphabetic code).
            Always consists of three uppercase Latin letters.
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: "USD"
        number:
          type: string
          description: >
            Three-digit numeric currency code. 
            Passed as a string to preserve leading zeros (e.g., '840' for USD).
          minLength: 3
          maxLength: 3
          pattern: '^\d{3}$'
          example: "840"
        name:
          type: string
          description: Official name of the currency in Russian or English.
          example: "US Dollar"
        decimals:
          type: integer
          description: >
            The number of decimal places (minor units) for fractional parts (cents, kopecks).
            Usually 2, but there are exceptions (e.g., 0 for JPY or 3 for BHD).
          minimum: 0
          maximum: 4
          example: 2

    CurrencyRevision:
      type: object
      description: Currency revision record reflecting changes made to currency data. This model is read-only.
      required:
        - id
        - currency_id
        - revision_number
        - change
        - changed_by
        - changed_at
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the revision record.
          readOnly: true
          example: 1024
        currency_id:
          type: integer
          format: int64
          description: Identifier of the currency this revision belongs to (references ISO 4217 standard currency data).
          readOnly: true
          example: 840
        revision_number:
          type: integer
          description: The sequential number of the revision, starting from 1.
          readOnly: true
          example: 3
        change:
          type: array
          description: Changes applied in this revision relative to the previous one, formatted as a JSON Patch (RFC 6902).
          readOnly: true
          items:
            type: object
          example:
            - op: "replace"
              path: "/name"
              value: "US Dollar"
        changed_by:
          type: string
          format: uuid
          description: UUID of the user or system component that performed the change.
          readOnly: true
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        changed_at:
          type: string
          format: date-time
          description: The date and time when the change was applied.
          readOnly: true
          example: "2026-10-05T07:54:00Z"

    ExpandedCurrency:
      type: object
      description: >
        Currency information in accordance with the ISO 4217 standard.
        Includes alphabetic and numeric codes, the name, and rounding precision.
      required:
        - code
        - number
        - name
        - decimals
        - revision
        - last_changer
        - created_at
        - updated_at
      properties:
        code:
          type: string
          description: >
            Three-letter international currency code (alphabetic code).
            Always consists of three uppercase Latin letters.
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: "USD"
        number:
          type: string
          description: >
            Three-digit numeric currency code. 
            Passed as a string to preserve leading zeros (e.g., '840' for USD).
          minLength: 3
          maxLength: 3
          pattern: '^\d{3}$'
          example: "840"
        name:
          type: string
          description: Official name of the currency in Russian or English.
          example: "US Dollar"
        decimals:
          type: integer
          description: >
            The number of decimal places (minor units) for fractional parts (cents, kopecks).
            Usually 2, but there are exceptions (e.g., 0 for JPY or 3 for BHD).
          minimum: 0
          maximum: 4
          example: 2
        revision:
          type: integer
          description: The sequential number of the latest revision applied to this currency.
          example: 3
        last_changer:
          type: string
          format: uuid
          description: UUID of the user or system component that performed the latest change.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        created_at:
          type: string
          format: date-time
          description: The date and time when the currency record was initially created.
          example: "2023-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: The date and time when the currency record was last updated.
          example: "2026-10-05T07:54:00Z"

  parameters:
    CurrencyID:
      name: currencyID
      in: path
      description: >
        Unique identifier of the currency record.
        Must be a positive integer.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 840

    ListPageSize:
      name: pageSize
      in: query
      description: Number of elements per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 50

    ListPageToken:
      name: pageToken
      in: query
      description: > 
        Pagination token for retrieving the next page of results.
        Use the token from the previous response to get the next page.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: "^[a-zA-Z0-9_-]+$"
        example: "eyJwYWdlIjoyLCJsaW1pdCI6NTB9"
  
  responses:
    CurrencyCreated:
      description: Currency successfully created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpandedCurrency'
          example:
            code: "USD"
            number: "840"
            name: "US Dollar"
            decimals: 2
            revision: 1
            last_changer: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
            created_at: "2026-10-05T07:54:00Z"
            updated_at: "2026-10-05T07:54:00Z"

    BadRequest:
      description: Invalid request data (validation error)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation_error:
              summary: Validation error
              value:
                error_code: "VALIDATION_ERROR"
                message: "Validation failed"
                details:
                  - field: "code"
                    message: "Must be exactly 3 uppercase letters"
                  - field: "number"
                    message: "Must be exactly 3 digits"

    Conflict:
      description: Currency already exists (conflict on code or number)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            duplicate_currency:
              summary: Duplicate currency
              value:
                error_code: "DUPLICATE_CURRENCY"
                message: "Currency with this code already exists"
                details:
                  - field: "code"
                    message: "Currency code 'USD' is already in use"

    UnprocessableEntity:
      description: Unprocessable entity (business logic validation failed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            business_logic_error:
              summary: Business logic error
              value:
                error_code: "BUSINESS_LOGIC_ERROR"
                message: "Invalid currency configuration"
                details: []

    NotFound:
      description: Currency not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            currency_not_found:
              summary: Currency not found
              value:
                error_code: "NOT_FOUND"
                message: "Currency with the specified ID was not found"
                details:
                  - field: "currencyID"
                    message: "No currency exists with ID 999"
