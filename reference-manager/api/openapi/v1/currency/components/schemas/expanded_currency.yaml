type: object
description: Extended representation of a currency including audit and revision tracking fields.

properties:
  id:
    type: integer
    format: int64
    description: Unique identifier of the currency.
    example: 1

  code_alpha:
    type: string
    description: Three-letter ISO 4217 alphabetic code.
    minLength: 3
    maxLength: 3
    example: USD

  code_num:
    type: string
    description: Three-letter ISO 4217 numeric code.
    minLength: 3
    maxLength: 3
    example: "840"

  name:
    type: string
    description: Full official name of the currency.
    example: United States Dollar

  minor_units:
    type: integer
    format: int32
    description: Number of minor units (decimal places).
    example: 2

  symbol:
    type: string
    description: Currency symbol.
    example: "$"

  revision:
    type: integer
    format: int32
    description: Current revision number of the currency record.
    example: 5

  last_changer:
    type: string
    format: uuid
    description: UUID of the user or system that last modified this record.
    example: "123e4567-e89b-12d3-a456-426614174000"

  created_at:
    type: string
    format: date-time
    description: Timestamp of when the currency record was created.
    example: "2023-10-25T14:48:00Z"

  updated_at:
    type: string
    format: date-time
    description: Timestamp of the last update to the currency record.
    example: "2026-10-03T10:00:00Z"