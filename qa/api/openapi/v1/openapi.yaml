openapi: 3.1.0
info:
  title: QA System API
  version: 0.4.0-draft
  description: >
    Draft contract of the QA System (test management). Described in
    qa/docs/130.api-contracts.md. Role names refer to qa/docs/070.role-matrix.md.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: test-cases
  - name: templates
  - name: suites
  - name: admin
  - name: test-plans
  - name: runs
  - name: defects
  - name: reports
  - name: health
paths:
  /test-cases:
    get:
      tags: [test-cases]
      operationId: listTestCases
      summary: List test cases with filters
      parameters:
        - { name: module, in: query, schema: { type: string } }
        - { name: status, in: query, description: Without status ARCHIVED cases are not listed, schema: { $ref: '#/components/schemas/TestCaseStatus' } }
        - { name: type, in: query, schema: { type: string } }
        - { name: epicRef, in: query, schema: { type: string } }
        - { name: automated, in: query, schema: { type: boolean } }
        - { name: q, in: query, description: Substring of key or title, schema: { type: string } }
        - { name: suiteId, in: query, description: Cases of a suite (MANUAL composition or FILTER condition), schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Page of test cases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCasePage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [test-cases]
      operationId: createTestCase
      summary: Create a test case (version 1, status DRAFT)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /test-cases/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [test-cases]
      operationId: getTestCase
      summary: Get a test case in its current or a given version
      parameters:
        - { name: version, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Test case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [test-cases]
      operationId: updateTestCase
      summary: Save the test case; creates a new immutable version when content changed
      description: >
        Fields missing from the request keep their values from the current version. The module
        is immutable (the key is built from it). Reference fields (featureRef, epicRef,
        requirementRef) change without a new version. Errors - 409 CASE_ARCHIVED,
        409 VERSION_CONFLICT (stale `version` or a parallel save), 403 when a role other than
        qa-automation or qa-lead changes `automated` or `autotestKey`, 422 VALIDATION_FAILED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [test-cases]
      operationId: deleteDraftTestCase
      summary: Delete a draft that never took part in a run
      description: >
        Testers and automation engineers delete only their own drafts, qa-lead any draft.
        409 INVALID_TRANSITION - the case is not a draft; 409 CASE_HAS_RUNS - the case has run
        results or defects.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /test-cases/{id}/status:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [test-cases]
      operationId: changeTestCaseStatus
      summary: Change status (ACTUAL, NEEDS_UPDATE, ARCHIVED)
      description: >
        Transitions of qa/docs/050.entities.md, section 2. 409 INVALID_TRANSITION lists the
        allowed targets in errors[].reason; 409 CASE_NOT_READY - no step with an expected result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/TestCaseStatus' }
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '409': { $ref: '#/components/responses/Error' }
  /test-cases/{id}/versions:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [test-cases]
      operationId: listTestCaseVersions
      summary: Version history, newest first
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TestCaseVersionInfo' }
  /test-cases/copy:
    post:
      tags: [test-cases]
      operationId: copyTestCases
      summary: Copy one or several test cases atomically
      description: >
        Each copy is a DRAFT version 1 with copiedFromId set. `automated` and `autotestKey` are
        not copied - one autotest is linked to one case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Copies created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCasePage' }
        '422': { $ref: '#/components/responses/Error' }
  /test-cases/export:
    post:
      tags: [test-cases]
      operationId: exportTestCases
      summary: Planned, not implemented yet - export filtered test cases as CSV or XLSX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [csv, xlsx] }
                filter: { type: object, additionalProperties: true }
      responses:
        '200':
          description: File
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /test-cases/import:
    post:
      tags: [test-cases]
      operationId: importTestCases
      summary: Planned, not implemented yet - validate and, when apply=true, import a CSV or XLSX file
      parameters:
        - { name: apply, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Import report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
        '422': { $ref: '#/components/responses/Error' }
  /templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List test case templates (qa-tester and above)
      parameters:
        - { name: isActive, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Page of templates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatePage' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [templates]
      operationId: createTemplate
      summary: Create a template (qa-admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /templates/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [templates]
      operationId: getTemplate
      summary: Get a template
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [templates]
      operationId: updateTemplate
      summary: Replace a template (qa-admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /suites:
    get:
      tags: [suites]
      operationId: listSuites
      summary: List suites
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SuiteStatus' } }
        - { name: purpose, in: query, schema: { $ref: '#/components/schemas/SuitePurpose' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/SuiteKind' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Page of suites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuitePage' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [suites]
      operationId: createSuite
      summary: Create a suite; SMOKE and ACCEPTANCE - qa-lead only, one of each
      description: >
        422 VALIDATION_FAILED with errors[] - duplicate name (name/duplicate), the second suite
        of a purpose (purpose/exists:<name>), a case that is not ACTUAL (caseIds.N/status:<status>),
        filter missing for FILTER or present for MANUAL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuiteInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /suites/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [suites]
      operationId: getSuite
      summary: Get a suite with its composition
      responses:
        '200':
          description: Suite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [suites]
      operationId: updateSuite
      summary: Replace name, kind, filter and composition
      description: >
        Purpose is immutable. The name of SMOKE and ACCEPTANCE suites is fixed: the pipeline finds
        the suite by name (suiteName). Cases already in the suite stay whatever their status;
        new ones must be ACTUAL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuiteInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /suites/{id}/{action}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: action, in: path, required: true, schema: { type: string, enum: [archive, restore] } }
    post:
      tags: [suites]
      operationId: changeSuiteStatus
      summary: Archive or restore a suite (owner or qa-lead; SMOKE and ACCEPTANCE - qa-lead)
      description: Archiving deactivates the suite schedules. A repeated action - 409 INVALID_TRANSITION.
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/classifiers:
    get:
      tags: [admin]
      operationId: listClassifiers
      summary: Severity, priority and case type values (read - qa-viewer to qa-admin)
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/ClassifierKind' } }
        - { name: isActive, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Page of values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassifierPage' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: createClassifier
      summary: Add a priority or case type value (qa-admin); severity codes are fixed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassifierInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classifier' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/classifiers/{kind}/{code}:
    parameters:
      - { name: kind, in: path, required: true, schema: { $ref: '#/components/schemas/ClassifierKind' } }
      - { name: code, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      operationId: updateClassifier
      summary: Rename, reorder, enable or disable a value (qa-admin)
      description: Disabling a value used by a current case version, an active template or an open defect - 409 VALUE_IN_USE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassifierUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classifier' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/environments:
    get:
      tags: [admin]
      operationId: listEnvironments
      summary: Environments (read - qa-viewer to qa-admin)
      parameters:
        - { name: isActive, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Page of environments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentPage' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: createEnvironment
      summary: Create an environment (qa-admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvironmentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/environments/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [admin]
      operationId: updateEnvironment
      summary: Change name, base URLs or activity (qa-admin); the code is immutable
      description: Disabling an environment with unfinished runs or active schedules - 409 VALUE_IN_USE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvironmentUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/tracker-status-mapping:
    get:
      tags: [admin]
      operationId: getTrackerStatusMapping
      summary: Bug status mapping table (qa-admin)
      responses:
        '200':
          description: Mapping table
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerStatusMapping' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [admin]
      operationId: replaceTrackerStatusMapping
      summary: Replace the whole mapping table (qa-admin)
      description: >
        Rows missing from the request are removed. qaStatus is OPEN, IN_PROGRESS, FIXED or null
        (the Task Tracker status does not change the defect). A testing status -
        422 QA_STATUS_NOT_MAPPABLE, one entry per offending row in errors[].
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackerStatusMappingInput' }
      responses:
        '200':
          description: Saved table
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerStatusMapping' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /test-plans:
    get:
      tags: [test-plans]
      operationId: listTestPlans
      summary: List test plans, newest first
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TestPlanStatus' } }
        - { name: trackerIterationId, in: query, schema: { type: string } }
        - { name: planningProjectId, in: query, schema: { type: string } }
        - { name: planningReleaseId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Page of plans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlanPage' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [test-plans]
      operationId: createTestPlan
      summary: Create a test plan in DRAFT (qa-lead)
      description: >
        External references are stored as given and refsVerified stays false (ADR-010, ADR-015).
        422 VALIDATION_FAILED - endDate before startDate; planningProjectId is required for
        RELEASE and PROJECT, planningReleaseId for RELEASE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestPlanInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /test-plans/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [test-plans]
      operationId: getTestPlan
      summary: Plan with its composition
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [test-plans]
      operationId: updateTestPlan
      summary: Replace plan fields (qa-lead)
      description: Resets refsVerified. A COMPLETED or CANCELLED plan - 409 PLAN_CLOSED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestPlanInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /test-plans/{id}/cases:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [test-plans]
      operationId: addPlanCases
      summary: Add cases to the plan by ids or by filter (qa-lead)
      description: >
        Exactly one of ids and filter. New cases must be ACTUAL, otherwise nothing is added and
        409 CASE_NOT_ACTUAL lists them in errors[] (reason `<key>:<status>`); this also applies to
        filter, which selects drafts unless filter.status is set. Cases already in the plan are
        kept whatever their status. saveAsSuite (with filter only) saves the filter as a FILTER
        suite in the same transaction. 409 PLAN_CLOSED - the plan is closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanCasesInput' }
      responses:
        '200':
          description: Plan with the updated composition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /test-plans/{id}/cases/{caseId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [test-plans]
      operationId: removePlanCase
      summary: Remove a case from the plan (qa-lead)
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /test-plans/{id}/{action}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [activate, complete, cancel] }
    post:
      tags: [test-plans]
      operationId: changeTestPlanStatus
      summary: Activate, complete or cancel the plan (qa-lead)
      description: >
        Transitions of qa/docs/050.entities.md, section 3. 409 INVALID_TRANSITION - not allowed
        from the current status; 409 PLAN_EMPTY - activation without cases; 409 RUNS_NOT_FINISHED -
        completion with runs in CREATED or IN_PROGRESS. Cancelling aborts the unfinished runs.
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /test-plans/{id}/summary:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [test-plans]
      operationId: getTestPlanSummary
      summary: Last result of each case and open defects of the plan cases
      description: >
        lastResult is the latest result of the case in any run, as on the case card. A case
        without results counts as notRun.
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanSummary' }
        '404': { $ref: '#/components/responses/Error' }
  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List runs, newest first; qa-ci sees only its own
      parameters:
        - { name: planId, in: query, schema: { type: string, format: uuid } }
        - { name: suiteId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RunStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Page of runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [runs]
      operationId: createRun
      summary: Create a run from a plan or a suite; with start=true also start it
      description: >
        Takes the current versions of ACTUAL and NEEDS_UPDATE cases. qa-ci - from a suite only.
        422 RUN_EMPTY - no cases; 422 VALIDATION_FAILED - not exactly one of planId, suiteId,
        suiteName; unknown or inactive environment; unknown or archived suite (reason archived).
        409 PLAN_NOT_ACTIVE - the plan is not ACTIVE. 409 SUITE_ALREADY_RUNNING - start=true while
        the suite is IN_PROGRESS on this environment.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            A repeated call with the same key by the same client returns the same run with
            status 200 and does not repeat the checks (the pipeline uses the deployment commit SHA)
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunInput' }
            example: { suiteName: Smoke, environment: staging, start: true }
      responses:
        '200':
          description: The run created earlier with this Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '201':
          description: Run created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /runs/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [runs]
      operationId: getRun
      summary: Run with summary counters; another client's run is 404 for qa-ci
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [runs]
      operationId: deleteRun
      summary: Delete a run that has no recorded results (qa-lead)
      description: >
        Allowed in any status. 409 RUN_HAS_RESULTS - the run has results, step results or
        linked defects.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /runs/{id}/{action}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [start, complete, abort] }
    post:
      tags: [runs]
      operationId: changeRunStatus
      summary: Start, complete or abort the run
      description: >
        Transitions of qa/docs/050.entities.md, section 4. start - qa-tester, qa-automation,
        qa-lead, qa-ci (own runs); complete and abort - qa-lead. 409 INVALID_TRANSITION - not
        allowed from the current status; 409 SUITE_ALREADY_RUNNING - on start.
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /runs/{id}/rerun:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [runs]
      operationId: rerunRun
      summary: Planned, not implemented yet - create a rerun of failed and blocked cases
      responses:
        '200':
          description: The new run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '409': { $ref: '#/components/responses/Error' }
  /runs/{id}/results:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [runs]
      operationId: listRunResults
      summary: Results of the run with the steps of the fixed case version, by case key
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ResultStatus' } }
        - { name: assignee, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Page of results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResultPage' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /runs/{id}/results/{resultId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: resultId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [runs]
      operationId: recordResult
      summary: Record the result of a case and of its steps
      description: >
        Allowed while the run is IN_PROGRESS: 409 RUN_FINISHED for a finished run,
        409 INVALID_TRANSITION for a run not started. qa-tester - own or unassigned results,
        qa-lead - any (403 otherwise). FAILED needs actualResult here or on the failed step; a
        FAILED step requires status FAILED; stepId must belong to the fixed version of the case
        (422 VALIDATION_FAILED). FAILED creates an AUTO defect or links the open one and returns
        it in `defect`. steps replaces the step results recorded earlier. When no result is left
        in NOT_RUN the run becomes COMPLETED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultInput' }
      responses:
        '200':
          description: Result recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResult' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /runs/{id}/results/bulk-status:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [runs]
      operationId: bulkChangeResultStatus
      summary: Planned, not implemented yet - change the status of several results atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resultIds, status]
              properties:
                resultIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/ResultStatus' }
                comment: { type: string }
      responses:
        '200':
          description: Number of changed results
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed: { type: integer }
        '409': { $ref: '#/components/responses/Error' }
  /defects:
    get:
      tags: [defects]
      operationId: listDefects
      summary: Search defects, newest first
      description: planningProjectId, planningReleaseId and trackerIterationId are read through the defect's plan.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DefectStatus' } }
        - { name: severity, in: query, schema: { $ref: '#/components/schemas/Severity' } }
        - { name: author, in: query, schema: { type: string } }
        - { name: trackerMismatch, in: query, schema: { type: boolean } }
        - { name: planningProjectId, in: query, schema: { type: string } }
        - { name: planningReleaseId, in: query, schema: { type: string } }
        - { name: trackerIterationId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Page of defects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefectPage' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [defects]
      operationId: createDefect
      summary: Create a defect manually from a case, a step or a run result
      description: >
        origin=MANUAL, status NEW; the Task Tracker request is queued in the same transaction.
        testCaseId or runResultId is required; environment is required without runResultId.
        priority defaults to the priority of the case version. stepId must belong to the fixed
        version of the result, or to the current version of the case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefectInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefectDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /defects/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [defects]
      operationId: getDefect
      summary: Defect with its runs and comments
      responses:
        '200':
          description: Defect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefectDetail' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [defects]
      operationId: updateDefect
      summary: Change the fields sent in the request
      description: >
        Every change is written to the history. title, actualResult, severity and priority cannot
        be cleared. priority is read-only after the Bug is created in Task Tracker.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefectUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefectDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /defects/{id}/transitions:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [defects]
      operationId: transitionDefect
      summary: Move the defect to another status
      description: >
        Transitions of qa/docs/050.entities.md, section 6. READY_FOR_TEST, CLOSED, REOPENED -
        qa-tester, qa-lead. OPEN, IN_PROGRESS, FIXED - qa-lead (403 otherwise) and only with
        TRACKER_SYNC_ENABLED=false, otherwise 409 STATUS_OWNED_BY_TRACKER. 409 INVALID_TRANSITION
        lists the allowed targets in errors[].reason; reopening an AUTO defect while the case has
        another open AUTO defect gives reason `open-auto:<key>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: '#/components/schemas/DefectStatus' }
                comment: { type: string, minLength: 1 }
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefectDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /defects/{id}/history:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [defects]
      operationId: listDefectHistory
      summary: Change history, newest first
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DefectHistoryEntry' }
        '404': { $ref: '#/components/responses/Error' }
  /defects/{id}/comments:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [defects]
      operationId: addDefectComment
      summary: Add a comment (qa-viewer to qa-lead)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefectComment' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /reports/{resource}:
    parameters:
      - name: resource
        in: path
        required: true
        schema: { type: string, enum: [test-cases, test-plans, test-runs, test-results, defects] }
    get:
      tags: [reports]
      operationId: listReportData
      summary: Planned, not implemented yet - read-only paginated data for the reporting service (role qa-reports-reader)
      parameters:
        - { name: updatedSince, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Page of records with stable identifiers
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, totalPages]
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalPages: { type: integer }
        '403': { $ref: '#/components/responses/Error' }
  /livez:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      security: []
      responses:
        '200': { description: Alive }
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: A critical dependency is failing }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token, realm arch-info-system, client roles of qa-system.
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    TestCaseStatus: { type: string, enum: [DRAFT, ACTUAL, NEEDS_UPDATE, ARCHIVED] }
    TestPlanStatus: { type: string, enum: [DRAFT, ACTIVE, COMPLETED, CANCELLED] }
    RunStatus: { type: string, enum: [CREATED, IN_PROGRESS, COMPLETED, ABORTED] }
    ResultStatus: { type: string, enum: [NOT_RUN, PASSED, FAILED, BLOCKED, SKIPPED] }
    DefectStatus: { type: string, enum: [NEW, OPEN, IN_PROGRESS, FIXED, READY_FOR_TEST, CLOSED, REOPENED] }
    Severity: { type: string, enum: [BLOCKER, CRITICAL, MAJOR, MINOR, TRIVIAL] }
    Step:
      type: object
      required: [action, expectedResult]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        position: { type: integer, minimum: 1, readOnly: true }
        action: { type: string, minLength: 1 }
        expectedResult: { type: string, minLength: 1 }
    TestCaseInput:
      type: object
      required: [title, module, priority, severity, type]
      properties:
        title: { type: string, minLength: 1 }
        module: { type: string }
        description: { type: string }
        preconditions: { type: string }
        priority: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        type: { type: string }
        automated: { type: boolean, default: false }
        autotestKey: { type: string }
        featureRef: { type: string }
        epicRef: { type: string }
        requirementRef: { type: string }
        templateId: { type: string, format: uuid }
        steps:
          type: array
          items: { $ref: '#/components/schemas/Step' }
        version:
          type: integer
          minimum: 1
          description: >
            PUT only, optional: the version the edit is based on. If the case already has a
            newer version, the save is rejected with 409 VERSION_CONFLICT.
    TestCase:
      allOf:
        - $ref: '#/components/schemas/TestCaseInput'
        - type: object
          required: [id, key, status, version]
          properties:
            id: { type: string, format: uuid }
            key: { type: string, examples: [TC-RM-03] }
            status: { $ref: '#/components/schemas/TestCaseStatus' }
            version: { type: integer }
            currentVersion: { type: integer, description: Number of the latest version }
            copiedFromId: { type: string, format: uuid }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            lastResult:
              description: >
                Read-only. Latest run result of the case with status other than NOT_RUN.
                The test case itself has no actual-result field (ADR-014).
              oneOf:
                - { $ref: '#/components/schemas/LastResult' }
                - { type: 'null' }
    LastResult:
      type: object
      required: [runId, runKey, status, finishedAt]
      properties:
        runId: { type: string, format: uuid }
        runKey: { type: string }
        caseVersion: { type: integer }
        status: { $ref: '#/components/schemas/ResultStatus' }
        actualResult: { type: string }
        failedStepPosition: { type: integer }
        environment: { type: string }
        finishedAt: { type: string, format: date-time }
    TestCaseVersionInfo:
      type: object
      required: [version, author, createdAt, changedFields]
      properties:
        version: { type: integer }
        author: { type: string }
        createdAt: { type: string, format: date-time }
        changedFields:
          type: array
          items: { type: string }
    TestCasePage:
      type: object
      required: [items, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TestCase' }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    ImportReport:
      type: object
      required: [applied, created, updated, rejected, errors]
      properties:
        applied: { type: boolean }
        created: { type: integer }
        updated: { type: integer }
        rejected: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              field: { type: string }
              reason: { type: string }
    SuiteKind: { type: string, enum: [MANUAL, FILTER] }
    SuiteStatus: { type: string, enum: [ACTIVE, ARCHIVED] }
    SuitePurpose: { type: string, enum: [GENERAL, SMOKE, ACCEPTANCE] }
    ClassifierKind: { type: string, enum: [SEVERITY, PRIORITY, CASE_TYPE] }
    TemplateBody:
      type: object
      description: Default fields and steps of a new case
      properties:
        description: { type: string }
        preconditions: { type: string }
        priority: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        type: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/Step' }
    TemplateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        body: { $ref: '#/components/schemas/TemplateBody' }
        isActive: { type: boolean, default: true }
    Template:
      type: object
      required: [id, name, body, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        body: { $ref: '#/components/schemas/TemplateBody' }
        isActive: { type: boolean }
    TemplatePage:
      type: object
      required: [items, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Template' }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    CaseFilter:
      type: object
      additionalProperties: false
      description: >
        Case selection of a FILTER suite; same meaning as the GET /test-cases parameters.
        suiteId may reference a MANUAL suite only.
      properties:
        module: { type: string }
        status: { $ref: '#/components/schemas/TestCaseStatus' }
        type: { type: string }
        epicRef: { type: string }
        automated: { type: boolean }
        q: { type: string }
        suiteId: { type: string, format: uuid }
    SuiteInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1 }
        kind: { $ref: '#/components/schemas/SuiteKind' }
        purpose:
          $ref: '#/components/schemas/SuitePurpose'
          description: GENERAL when omitted on create; immutable afterwards
        filter: { $ref: '#/components/schemas/CaseFilter' }
        caseIds:
          type: array
          description: Full composition of a MANUAL suite
          items: { type: string, format: uuid }
    Suite:
      type: object
      required: [id, name, kind, purpose, status, owner, caseIds, caseCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/SuiteKind' }
        purpose: { $ref: '#/components/schemas/SuitePurpose' }
        status: { $ref: '#/components/schemas/SuiteStatus' }
        owner: { type: string }
        filter:
          oneOf:
            - { $ref: '#/components/schemas/CaseFilter' }
            - { type: 'null' }
        caseIds:
          type: array
          items: { type: string, format: uuid }
        caseCount: { type: integer, description: Cases the suite selects now, archived excluded }
    SuitePage:
      type: object
      required: [items, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Suite' }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    ClassifierInput:
      type: object
      required: [kind, code, name]
      properties:
        kind: { $ref: '#/components/schemas/ClassifierKind' }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,31}$' }
        name: { type: string, minLength: 1 }
        sortOrder: { type: integer, default: 0 }
        isActive: { type: boolean, default: true }
    ClassifierUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    Classifier:
      type: object
      required: [kind, code, name, sortOrder, isActive]
      properties:
        kind: { $ref: '#/components/schemas/ClassifierKind' }
        code: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    ClassifierPage:
      type: object
      required: [items, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Classifier' }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    EnvironmentInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
        name: { type: string, minLength: 1 }
        baseUrls:
          type: object
          description: 'Subsystem base URLs, e.g. {"task-tracker": "http://..."}'
          additionalProperties: { type: string, pattern: '^https?://' }
        isActive: { type: boolean, default: true }
    EnvironmentUpdate:
      type: object
      properties:
        code: { type: string, description: Must equal the current code if sent }
        name: { type: string, minLength: 1 }
        baseUrls:
          type: object
          additionalProperties: { type: string, pattern: '^https?://' }
        isActive: { type: boolean }
    Environment:
      type: object
      required: [id, code, name, baseUrls, isActive]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        baseUrls:
          type: object
          additionalProperties: { type: string }
        isActive: { type: boolean }
    EnvironmentPage:
      type: object
      required: [items, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Environment' }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    TrackerStatusMappingItem:
      type: object
      required: [trackerStatusId, trackerStatusName]
      properties:
        trackerStatusId: { type: string, minLength: 1 }
        trackerStatusName: { type: string, minLength: 1 }
        qaStatus:
          description: OPEN, IN_PROGRESS, FIXED, or null - the status does not change the defect
          oneOf:
            - { $ref: '#/components/schemas/DefectStatus' }
            - { type: 'null' }
        requiresAssignee: { type: boolean, default: false, description: The mapping applies only when the Bug has an assignee }
        isActive: { type: boolean, default: true }
    TrackerStatusMappingInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TrackerStatusMappingItem' }
    TrackerStatusMappingRow:
      allOf:
        - $ref: '#/components/schemas/TrackerStatusMappingItem'
        - type: object
          required: [updatedBy, updatedAt]
          properties:
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time }
    TrackerStatusMapping:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TrackerStatusMappingRow' }
    TestPlanInput:
      type: object
      required: [name, scopeKind, owner, startDate, endDate]
      properties:
        name: { type: string, minLength: 1 }
        scopeKind: { type: string, enum: [RELEASE, ITERATION, PROJECT, MODULE] }
        scopeRef: { type: [string, 'null'], description: Module for scopeKind MODULE }
        owner: { type: string, minLength: 1 }
        teamRef: { type: [string, 'null'] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        trackerIterationId: { type: [string, 'null'] }
        planningMilestoneId: { type: [string, 'null'], description: logicalItemId of the MILESTONE in Planning System }
        planningProjectId: { type: [string, 'null'], description: Required when scopeKind is RELEASE or PROJECT }
        planningReleaseId: { type: [string, 'null'], description: logicalItemId of the RELEASE in Planning System; required when scopeKind is RELEASE }
        planningPlanVersionId: { type: [string, 'null'], description: Planning System plan version the release was selected from }
    TestPlan:
      allOf:
        - $ref: '#/components/schemas/TestPlanInput'
        - type: object
          required: [id, key, status, refsVerified, createdAt, updatedAt, caseIds, caseCount]
          properties:
            id: { type: string, format: uuid }
            key: { type: string, examples: [TP-12] }
            status: { $ref: '#/components/schemas/TestPlanStatus' }
            refsVerified: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            caseIds:
              type: array
              description: Composition of the plan, by case key
              items: { type: string, format: uuid }
            caseCount: { type: integer }
    TestPlanPage:
      type: object
      required: [items, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TestPlan' }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    PlanCasesInput:
      type: object
      description: Exactly one of ids and filter
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
        filter: { $ref: '#/components/schemas/CaseFilter' }
        saveAsSuite: { type: string, minLength: 1, description: Name of the FILTER suite to save the filter under }
    PlanSummary:
      type: object
      required: [planId, counters, cases, openDefects]
      properties:
        planId: { type: string, format: uuid }
        counters:
          type: object
          required: [total, passed, failed, blocked, skipped, notRun]
          properties:
            total: { type: integer }
            passed: { type: integer }
            failed: { type: integer }
            blocked: { type: integer }
            skipped: { type: integer }
            notRun: { type: integer }
        cases:
          type: array
          items:
            type: object
            required: [testCaseId, testCaseKey, title, status, lastResult]
            properties:
              testCaseId: { type: string, format: uuid }
              testCaseKey: { type: string }
              title: { type: string }
              status: { $ref: '#/components/schemas/TestCaseStatus' }
              lastResult:
                oneOf:
                  - { $ref: '#/components/schemas/LastResult' }
                  - { type: 'null' }
        openDefects:
          type: array
          items:
            type: object
            required: [id, key, title, status, severity, testCaseId]
            properties:
              id: { type: string, format: uuid }
              key: { type: string }
              title: { type: string }
              status: { $ref: '#/components/schemas/DefectStatus' }
              severity: { type: string }
              testCaseId: { type: string, format: uuid }
    RunInput:
      type: object
      required: [environment]
      properties:
        planId: { type: string, format: uuid }
        suiteId: { type: string, format: uuid }
        suiteName: { type: string, minLength: 1, description: Alternative to suiteId for CI }
        environment: { type: string, minLength: 1, description: Code of an active environment }
        start: { type: boolean, default: false }
        automatedOnly: { type: boolean, default: false, description: Take only cases with an implemented autotest }
      oneOf:
        - required: [planId]
        - required: [suiteId]
        - required: [suiteName]
    RunSummary:
      type: object
      required: [total, passed, failed, blocked, notRun, skipped, unverified]
      properties:
        total: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        blocked: { type: integer }
        notRun: { type: integer }
        skipped: { type: integer }
        unverified: { type: integer, description: 'SKIPPED with failureReason "проверка невозможна"' }
    Run:
      type: object
      required: [id, key, status, environment, trigger, startedBy, createdAt, summary, smokeVerdict, verdict]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, examples: [RUN-87] }
        planId: { type: [string, 'null'], format: uuid }
        suiteId: { type: [string, 'null'], format: uuid }
        parentRunId: { type: [string, 'null'], format: uuid }
        environment: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        trigger: { type: string, enum: [MANUAL, SCHEDULE, CI] }
        startedBy: { type: string }
        autotestsCommitSha: { type: [string, 'null'] }
        sutVersions:
          type: [object, 'null']
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        durationMs: { type: [integer, 'null'] }
        summary: { $ref: '#/components/schemas/RunSummary' }
        smokeVerdict: { type: [string, 'null'], enum: [GREEN, RED, null], description: GREEN when the finished run has no FAILED results; null until it finishes }
        verdict: { type: [string, 'null'], enum: [ACCEPTED, REJECTED, null], description: Stand acceptance verdict, only for the acceptance suite }
        verdictBy: { type: [string, 'null'] }
        verdictAt: { type: [string, 'null'], format: date-time }
    RunPage:
      type: object
      required: [items, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Run' }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    ResultInput:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ResultStatus' }
        actualResult: { type: [string, 'null'] }
        comment: { type: [string, 'null'] }
        failureReason: { type: [string, 'null'] }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        steps:
          type: [array, 'null']
          description: Full set of step results; replaces the one recorded earlier
          items:
            type: object
            required: [stepId, status]
            properties:
              stepId: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/ResultStatus' }
              actualResult: { type: [string, 'null'] }
              comment: { type: [string, 'null'] }
    RunResultStep:
      type: object
      required: [stepId, position, action, expectedResult, status]
      description: Step of the fixed case version with its result; NOT_RUN when none was recorded
      properties:
        stepId: { type: string, format: uuid }
        position: { type: integer }
        action: { type: string }
        expectedResult: { type: string }
        status: { $ref: '#/components/schemas/ResultStatus' }
        actualResult: { type: [string, 'null'] }
        comment: { type: [string, 'null'] }
    DefectLink:
      type: object
      required: [id, key, created]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        created: { type: boolean, description: true only in the PUT that created the defect }
    RunResult:
      type: object
      required: [id, testCaseId, testCaseKey, title, caseVersion, status, steps]
      properties:
        id: { type: string, format: uuid }
        testCaseId: { type: string, format: uuid }
        testCaseKey: { type: string }
        title: { type: string, description: Title in the fixed case version }
        caseVersion: { type: integer }
        assignee: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ResultStatus' }
        failedStepPosition: { type: [integer, 'null'] }
        actualResult: { type: [string, 'null'] }
        comment: { type: [string, 'null'] }
        failureReason: { type: [string, 'null'] }
        executedBy: { type: [string, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        durationMs: { type: [integer, 'null'] }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RunResultStep' }
        defect:
          description: The defect created or linked for this result
          oneOf:
            - { $ref: '#/components/schemas/DefectLink' }
            - { type: 'null' }
    RunResultPage:
      type: object
      required: [items, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RunResult' }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    DefectInput:
      type: object
      required: [title, actualResult, severity]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        reproSteps: { type: [string, 'null'] }
        expectedResult: { type: [string, 'null'] }
        actualResult: { type: string, minLength: 1 }
        severity: { $ref: '#/components/schemas/Severity' }
        priority: { type: [string, 'null'], description: Proposed priority; after the Bug is created Task Tracker owns the fix priority }
        testCaseId: { type: [string, 'null'], format: uuid }
        runResultId: { type: [string, 'null'], format: uuid }
        stepId: { type: [string, 'null'], format: uuid }
        environment: { type: [string, 'null'], description: Environment code }
        requirementRef: { type: [string, 'null'] }
        epicRef: { type: [string, 'null'] }
    DefectUpdate:
      type: object
      description: Only the fields sent are changed
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        reproSteps: { type: [string, 'null'] }
        expectedResult: { type: [string, 'null'] }
        actualResult: { type: string, minLength: 1 }
        severity: { $ref: '#/components/schemas/Severity' }
        priority: { type: string }
        environment: { type: [string, 'null'], description: Environment code }
        buildVersion: { type: [string, 'null'] }
        requirementRef: { type: [string, 'null'] }
        epicRef: { type: [string, 'null'] }
    Defect:
      type: object
      required: [id, key, origin, title, actualResult, severity, priority, status, author, trackerSyncState, trackerMismatch, reopenCount, createdAt, updatedAt, runIds]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, examples: [DEF-45] }
        origin: { type: string, enum: [AUTO, MANUAL] }
        title: { type: string }
        description: { type: [string, 'null'] }
        reproSteps: { type: [string, 'null'] }
        expectedResult: { type: [string, 'null'] }
        actualResult: { type: string }
        severity: { type: string }
        priority: { type: string, description: Proposed priority }
        status: { $ref: '#/components/schemas/DefectStatus' }
        environment: { type: [string, 'null'] }
        buildVersion: { type: [string, 'null'] }
        author: { type: string }
        testCaseId: { type: [string, 'null'], format: uuid }
        testCaseKey: { type: [string, 'null'] }
        caseVersion: { type: [integer, 'null'] }
        stepId: { type: [string, 'null'], format: uuid }
        planId: { type: [string, 'null'], format: uuid }
        requirementRef: { type: [string, 'null'] }
        epicRef: { type: [string, 'null'] }
        trackerWorkItemId: { type: [string, 'null'] }
        trackerWorkItemUrl: { type: [string, 'null'] }
        trackerSyncState: { type: string, enum: [PENDING, SYNCED, FAILED] }
        trackerStatus: { type: [string, 'null'], description: Read-only copy of the Bug status in Task Tracker }
        trackerPriority: { type: [string, 'null'], description: Read-only copy of the Bug priority in Task Tracker }
        trackerAssignee: { type: [string, 'null'] }
        trackerMismatch: { type: boolean, description: Statuses of the two systems differ according to the mapping table }
        reopenCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        runIds:
          type: array
          items: { type: string, format: uuid }
    DefectComment:
      type: object
      required: [id, author, source, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { type: string }
        source: { type: string, enum: [QA, TRACKER, SYSTEM] }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    DefectDetail:
      allOf:
        - $ref: '#/components/schemas/Defect'
        - type: object
          required: [runs, comments]
          properties:
            runs:
              type: array
              items:
                type: object
                required: [runId, runKey, resultId, resultStatus, linkedAt]
                properties:
                  runId: { type: string, format: uuid }
                  runKey: { type: string }
                  resultId: { type: string, format: uuid }
                  resultStatus: { $ref: '#/components/schemas/ResultStatus' }
                  linkedAt: { type: string, format: date-time }
            comments:
              type: array
              items: { $ref: '#/components/schemas/DefectComment' }
    DefectPage:
      type: object
      required: [items, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Defect' }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    DefectHistoryEntry:
      type: object
      required: [author, source, field, occurredAt]
      properties:
        author: { type: string }
        source: { type: string, enum: [QA, TRACKER, SYSTEM] }
        field: { type: string }
        oldValue: { type: [string, 'null'] }
        newValue: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code: { type: string, examples: [INVALID_TRANSITION] }
        message: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }
