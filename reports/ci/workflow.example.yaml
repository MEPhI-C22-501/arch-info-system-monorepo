# Template only. GitHub discovers workflows under .github/workflows, not here.
# Moving this template there requires a separate change outside reports/.
name: Reports checks
on:
  push:
    paths: ['reports/**', 'task-tracker/docs/block-g-api-and-events/openapi.yaml', 'qa/api/**', 'planning-system/docs/contracts/**', 'reference-manager/backend/api/openapi/**']
  pull_request:
    paths: ['reports/**', 'task-tracker/docs/block-g-api-and-events/openapi.yaml', 'qa/api/**', 'planning-system/docs/contracts/**', 'reference-manager/backend/api/openapi/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r reports/pilots/requirements-test.txt
      - run: npm install --prefix reports/ci
      - run: python reports/ci/record_checks.py --native-postgres
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reports-native-verification
          path: |
            reports/pilots/artifacts/verification.json
            reports/pilots/artifacts/acceptance-verification.json
            reports/pilots/artifacts/restore-verification.json
            reports/pilots/artifacts/secret-verification.json
  local-bi:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r reports/pilots/requirements.txt
      # The ephemeral runner has no shared secrets; create demo-only values in
      # the sole permitted secret store. Never upload this file or Compose config.
      - run: python reports/ci/init_pilot_secrets.py
      - run: python reports/pilots/launch.py up --build -d --wait --wait-timeout 240
      - run: python reports/pilots/check_roles.py --record
      - run: python reports/pilots/check_bi.py --record
      - run: python reports/pilots/check_product.py --record
      - run: python reports/pilots/launch.py exec -T superset python /app/pythonpath/check_session.py
      - run: python reports/ci/check_secrets.py --record
      - if: always()
        run: python reports/pilots/launch.py down -v
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reports-bi-verification
          path: |
            reports/pilots/artifacts/bi-verification.json
            reports/pilots/artifacts/role-verification.json
            reports/pilots/artifacts/product-verification.json
            reports/pilots/artifacts/secret-verification.json
