<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Reports</title><link rel="stylesheet" href="/ui/styles.css"><script src="/ui/app.js" defer></script>
<body><header><h1>Reports</h1><button id="login">Войти через Keycloak</button><button id="logout" hidden>Выйти</button></header>
<main><p id="status" role="status">Для работы войдите в систему.</p>
<section id="workspace" hidden><h2>Сформировать отчёт</h2>
<form id="query"><label>Отчёт<select id="report"></select></label><label>С<input id="from" type="date" required></label><label>По<input id="to" type="date" required></label>
<label>Разрез<select id="slice"></select></label><label>Проекты (ID через запятую)<input id="projects"></label><label>Сотрудники (sub через запятую)<input id="employees"></label><label><input id="compare" type="checkbox">Сравнить с предыдущим периодом</label><button>Сформировать</button></form>
<div class="actions"><button id="csv">Выгрузить CSV</button><button id="xlsx">Выгрузить XLSX</button><button id="print">Версия для печати</button><button id="save">Сохранить представление</button></div>
<h2>Результат</h2><p id="notes"></p><pre id="freshness"></pre><div id="totals" class="cards"></div><div id="chart"></div><div class="scroll"><table id="result"></table></div><p id="comparison"></p>
<h2>Мои представления</h2><div id="views"></div>
<h2>Выгрузки</h2><div id="exports"></div>
<h2>Подписки</h2><form id="subscribe"><label>Расписание cron (Europe/Moscow)<input id="schedule" value="0 9 * * 1" required></label><label>Получатели (sub через запятую)<input id="recipients" required></label><button>Создать подписку CSV</button></form><div id="subscriptions"></div>
<h2>Уведомления</h2><div id="notifications"></div><button id="refresh">Обновить списки</button><button id="audit">Показать аудит (администратор)</button><pre id="audit-result"></pre>
</section></main></body></html>
