        thresholdSeconds:
          type: integer
        state:
          type: string
          enum: [UNKNOWN, FRESH, STALE]
    Batch:
      type: object
      required: [batchId, source, stream, kind, status, startedAt]
      properties:
        batchId:
          type: integer
        source:
          $ref: '#/components/schemas/Source'
        stream:
          type: string
        kind:
          type: string
          enum: [INCREMENTAL, FULL, RECONCILIATION]
        status:
          $ref: '#/components/schemas/BatchStatus'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        rowsExtracted:
          type: integer
        rowsLoaded:
          type: integer
        error:
          type: string
          nullable: true
    Reconciliation:
      type: object
      required: [reconciliationId, source, stream, status]
      properties:
        reconciliationId:
          type: integer
        source:
          $ref: '#/components/schemas/Source'
        stream:
          type: string
        sourceCount:
