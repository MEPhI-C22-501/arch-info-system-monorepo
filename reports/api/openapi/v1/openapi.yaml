        passRate:
          type: number
          nullable: true
          description: M-14, доля
        defectDensity:
          type: number
          nullable: true
          description: M-16, дефектов на 10 завершённых задач
        reopenedRate:
          type: number
          nullable: true
          description: M-17, доля
        freshness:
