<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning System — прототип</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172e41;background:#f3f5f7;font-size:15px;--blue:#235cca;--muted:#586b7c;--line:#dce3e9}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;color:inherit;padding:10px 14px}button:hover{background:#eaf0fb}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#1847a3}input,select{border:1px solid #a7b7c5;border-radius:7px;padding:9px;background:white;color:inherit}input[type=number]{width:90px}a{color:var(--blue)}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}aside{background:#152c3e;color:#e9f0f5;padding:30px 18px}.brand{font-size:24px;font-weight:750;letter-spacing:-1px;padding:0 12px}.brand span{color:#83b8ff}.subbrand{font-size:12px;color:#b4c5d3;letter-spacing:1.4px;margin:7px 12px 32px}nav a{display:block;text-decoration:none;color:#cbd7e1;padding:10px 13px;margin:3px 0;border-radius:7px;font-size:14px}nav a[aria-current=page]{background:#284b69;color:white;border-left:3px solid #8dc5ff}.nav-group{padding:16px 13px 6px;font-size:10px;letter-spacing:1.8px;color:#9eb4c5}.side-foot{margin:28px 12px;font-size:12px;line-height:1.6;color:#b4c5d3}
header{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:22px 36px;border-bottom:1px solid var(--line);background:white}.context{font-size:13px;color:var(--muted)}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tools label{font-size:12px}main{padding:30px 36px;max-width:1450px;margin:auto}.notice{border:1px solid #c8d9ed;background:#edf4ff;padding:12px 16px;border-radius:9px;font-size:13px;margin-bottom:25px;line-height:1.5}.page-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:30px;line-height:1.2;margin:3px 0 10px;letter-spacing:-.6px}h2{font-size:19px;margin:0 0 18px}h3{font-size:15px;margin:0 0 12px}p{line-height:1.6}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-size:10px;font-weight:700;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.two{grid-template-columns:1.3fr 1fr}.stat{font-size:30px;font-weight:700;margin:12px 0 6px}.badge{display:inline-block;border-radius:5px;padding:5px 9px;font-size:11px;font-weight:700;letter-spacing:.5px;background:#e6eefc;color:#224a8c}.good{background:#def4e9;color:#20674c}.bad{background:#fff0df;color:#985414}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}td,th{padding:14px 10px;border-bottom:1px solid #e8edf1}td{font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.field{display:grid;gap:8px;margin:16px 0}.field input{max-width:500px}.steps{display:flex;gap:8px;flex-wrap:wrap}.step{border-radius:6px;padding:8px 12px;background:#eef2f6;font-size:12px}.step.done{background:#e0eee8}.bar{height:11px;background:#e9eff7;border-radius:4px;margin:10px 0}.bar span{height:100%;display:block;background:#4274c7;border-radius:4px;max-width:100%}.gantt{display:grid;grid-template-columns:160px repeat(5,1fr);gap:8px;align-items:center;min-width:560px}.gantt>div{padding:13px;background:#f2f5f9;text-align:center;border-radius:5px}.gantt .task{background:#d8e8ff;border-left:4px solid #3268b9}.scroll{overflow:auto}.timeline{border-left:2px solid #d6e3f2;padding-left:20px}.timeline p{font-size:13px}.empty{text-align:center;padding:50px 15px;color:var(--muted)}#toast{position:fixed;right:25px;bottom:20px;max-width:480px;background:#17384c;color:white;padding:15px 22px;border-radius:10px;box-shadow:0 8px 30px #14273733;z-index:10}#toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:14px;max-width:500px;padding:28px}dialog::backdrop{background:#0f253c66}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}footer{font-size:12px;color:var(--muted);padding:16px 0}.status-line{font-size:12px;margin-top:7px;color:var(--muted)}
@media(max-width:1000px){.grid,.two{grid-template-columns:1fr}.shell{grid-template-columns:200px 1fr}header,main{padding:22px}.tools{gap:6px}}@media(max-width:700px){.shell{display:block}aside{padding:16px}.brand{font-size:21px}.subbrand,.nav-group,.side-foot{display:none}nav{display:flex;overflow:auto;margin-top:12px}nav a{white-space:nowrap}.page-top,header{display:block}.tools{margin-top:15px}h1{font-size:25px}main{padding:18px}.card{padding:17px}.grid{gap:0}}
</style></head>
<body><div class="shell"><aside><div class="brand">planning<span>.</span></div><div class="subbrand">ПЛАНЫ · РЕСУРСЫ · РЕШЕНИЯ</div><nav aria-label="Основная навигация" id="nav"></nav><div class="side-foot">Учебный проект<br>Синтетические данные<br>05 октября 2026</div></aside><div><header><div class="context">Рабочее пространство / <strong>Портфель ERP</strong><div class="status-line" id="saved">Черновик сохранён локально</div></div><div class="tools"><label for="role">Роль</label><select id="role"><option value="R-02">R-02 · Планировщик</option><option value="R-01">R-01 · Руководитель портфеля</option><option value="R-03">R-03 · Руководитель проекта</option><option value="R-04">R-04 · Ресурсный руководитель</option><option value="R-05">R-05 · Участник команды</option><option value="R-06">R-06 · Администратор</option></select><button id="reset">Сбросить демо</button></div></header><main id="main" tabindex="-1"></main></div></div><div id="toast" role="status" aria-live="polite"></div><dialog id="confirm"><h2 id="confirm-title">Подтверждение</h2><p id="confirm-text"></p><div class="actions"><button id="confirm-yes" class="primary">Подтвердить</button><button id="confirm-no">Отмена</button></div></dialog>
<script>
'use strict';
const initial=()=>({name:'ERP · планирование ресурсов',role:'R-02',status:'DRAFT',revision:1,version:1,scenario:false,demand:6,allocation:6,availability:4,confirmed:false,reviewRound:0,baseline:null,publication:'FAILED',events:['Создан демонстрационный черновик'],attachment:false,date:'2026-10-09'});
const key='planning-prototype-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||initial();if(!state.role)state=initial()}catch{state=initial()}
const screens=[['portfolio','Портфель и проекты','01'],['structure','Декомпозиция','02'],['demand','Потребность','03'],['resources','Доступность и назначения','04'],['gantt','Диаграмма Ганта','05'],['conflicts','Конфликты ресурсов','06'],['scenarios','Сравнение сценариев','07'],['approval','Согласование версии','08'],['calendar','Личный календарь','09'],['attachments','Вложения','10'],['forecast','План-факт и прогноз','11'],['exchange','Журнал обмена','12']];
let screen=location.hash.slice(1)||'portfolio', mode='normal',timer;
const $=id=>document.getElementById(id), escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const editable=()=>state.status==='DRAFT'&&['R-02','R-03'].includes(state.role);
const roleScreens=()=>state.role==='R-06'?['exchange']:state.role==='R-05'?['calendar','attachments']:state.role==='R-04'?['resources','conflicts','gantt','approval','attachments']:screens.map(x=>x[0]).filter(x=>x!=='exchange');
const overload=()=>Math.max(state.allocation-state.availability,0), deficit=()=>Math.max(state.demand-state.allocation,0);
function save(message){try{localStorage.setItem(key,JSON.stringify(state));$('saved').textContent='Сохранено в этом браузере · редакция '+state.revision}catch{$('saved').textContent='Хранилище недоступно; данные только в памяти'}if(message)toast(message)}
function toast(text){$('toast').textContent=text;clearTimeout(timer);timer=setTimeout(()=>{$('toast').textContent=''},5500)}
function change(message){state.revision++;state.events.push(message);save(message);render()}
function confirmAction(title,text,fn){$('confirm-title').textContent=title;$('confirm-text').textContent=text;$('confirm').showModal();$('confirm-yes').onclick=()=>{$('confirm').close();fn()};$('confirm-no').onclick=()=>$('confirm').close()}
const link=(id,text)=>`<a href="#${id}">${text}</a>`, button=(action,text,primary=false,disabled=false)=>`<button data-action="${action}" ${primary?'class="primary"':''} ${disabled?'disabled':''}>${text}</button>`;
const badge=()=>`<span class="badge ${state.status==='ACTIVE'?'good':''}">${state.status} · V${state.version}</span>`;
function nav(){const visible=roleScreens();if(!visible.includes(screen))screen=visible[0];$('nav').innerHTML=screens.filter(s=>visible.includes(s[0])).map(([id,title,no])=>`<a href="#${id}" ${screen===id?'aria-current="page"':''}><span style="opacity:.5;margin-right:8px">${no}</span>${title}</a>`).join('');$('role').value=state.role}
function render(){nav();const title=screens.find(s=>s[0]===screen)[1];$('main').innerHTML=`<div class="notice"><strong>Кликабельный прототип.</strong> Изменения сохраняются только в этом браузере. Вход, серверные права, обмен и файлы моделируются. Для сценария согласования переключайте роль вверху.</div><div class="page-top"><div><div class="eyebrow">Портфель ERP / ${escape(state.name)}</div><h1>${title}</h1><span class="muted">Версия ${state.version}${state.scenario?' · сценарий «Что если»':''} · срез 05.10.2026</span></div><div>${badge()}<div class="status-line">Редакция ${state.revision}</div></div></div><div class="tools" style="margin-bottom:20px"><label for="view-state">Проверка состояния экрана</label><select id="view-state"><option value="normal">Обычный экран</option><option value="loading">Загрузка</option><option value="empty">Нет данных</option><option value="error">Ошибка</option></select></div><div id="content"></div><footer>Прототип интерфейса · контракты и критерии приёмки описаны в документации 110–165.</footer>`;$('view-state').value=mode;$('view-state').onchange=e=>{mode=e.target.value;render()};if(mode!=='normal'){$('content').innerHTML=`<div class="card empty" role="status"><h2>${{loading:'Загрузка данных…',empty:'Пока нет данных',error:'Не удалось загрузить данные'}[mode]}</h2><p>${mode==='loading'?'Подождите завершения запроса. Это демонстрационное состояние.':mode==='empty'?'Данные появятся после создания плана или назначения.':'Последний сохранённый план не изменён. Проверьте соединение и повторите.'}</p>${button('normal',mode==='error'?'Повторить':'Вернуться к данным',true)}</div>`;return}
const cards={
 portfolio:()=>`<div class="grid"><div class="card"><div class="eyebrow">Проект в портфеле</div><div class="stat">01</div><span class="muted">ERP · годовой план</span></div><div class="card"><div class="eyebrow">Оценка до завершения</div><div class="stat">8 <small>ч</small></div><span class="muted">Ручная оценка планировщика</span></div><div class="card"><div class="eyebrow">Ресурсный конфликт</div><div class="stat">${overload()} <small>ч</small></div><span class="muted">Перегрузка · 5 октября</span></div></div><div class="card"><h2>Проекты</h2><div class="scroll"><table><thead><tr><th>Проект</th><th>Владелец</th><th>План</th><th>Следующий шаг</th></tr></thead><tbody><tr><td><strong>${escape(state.name)}</strong><br><span class="muted">ERP-A · приоритет 1</span></td><td>Демо-руководитель</td><td>${badge()}</td><td>${link('structure','Открыть структуру →')}</td></tr></tbody></table></div></div><div class="card"><h3>Три демонстрационных маршрута</h3><p>${link('structure','Годовое планирование')} → ${link('resources','Ресурсы')} → ${link('approval','Согласование')}.</p><p>${link('conflicts','Конфликт')} → ресурсный руководитель подтверждает доступность → планировщик отправляет версию.</p><p>${link('scenarios','Сценарий')} → сравнение с baseline → новое согласование.</p></div>`,
 structure:()=>`<div class="card"><h2>Структура плана</h2><label class="field">Название проекта<input id="project-name" value="${escape(state.name)}" ${editable()?'':'disabled'} maxlength="120"></label><p class="muted">Название черновика сохраняется автоматически. Для изменения утверждённого плана создайте сценарий.</p><div class="scroll"><table><thead><tr><th>Элемент</th><th>Тип</th><th>Срок</th><th>План</th></tr></thead><tbody><tr><td>Релиз ERP 1.0</td><td>RELEASE</td><td>05.10 — ${escape(state.date)}</td><td>${state.demand} ч</td></tr><tr><td>↳ Планирование</td><td>EPIC</td><td>05.10 — ${escape(state.date)}</td><td>${state.demand} ч</td></tr><tr><td>　↳ Интерфейс</td><td>FEATURE</td><td>05.10</td><td>${state.demand} ч</td></tr><tr><td>　↳ Приёмка</td><td>MILESTONE</td><td>${escape(state.date)}</td><td>0 ч</td></tr></tbody></table></div><div class="actions">${link('demand','Далее: потребность →')}</div></div>`,
 demand:()=>`<div class="card"><h2>Потребность по ролям и грейдам</h2><p>Интерфейс · FEATURE · 05.10.2026</p><table><thead><tr><th>Роль</th><th>Грейд</th><th>Часы</th></tr></thead><tbody><tr><td>Разработчик</td><td>Middle</td><td><label><span class="sr-only">Часы потребности</span><input id="demand-hours" type="number" min="1" max="24" value="${state.demand}" ${editable()?'':'disabled'}></label></td></tr></tbody></table><p class="muted">Оценка задаётся листу. Родитель суммирует листья и не добавляет часы повторно.</p><div class="actions">${link('resources','Далее: доступность и назначения →')}</div></div>`,
 resources:()=>`<div class="grid two"><div class="card"><h2>Доступность · 5 октября</h2><p>Демо-сотрудник · employees/demo-1</p><label class="field">Доступно часов<input id="available-hours" type="number" min="0" max="24" value="${state.availability}" ${state.role==='R-04'?'':'disabled'}></label><p class="muted">В исходном примере: 8 часов нормы − 4 часа отсутствия. Изменение здесь моделирует подтверждённую плановую предпосылку.</p>${button('confirm-resource','Подтвердить доступность и назначение',true,state.role!=='R-04'||state.status!=='DRAFT'||overload()>0||deficit()>0)}<p>${state.confirmed?'<span class="badge good">Подтверждено</span>':'Ожидает ресурсного руководителя'}</p></div><div class="card"><h2>Назначение на работу</h2><label class="field">Назначено часов<input id="allocation-hours" type="number" min="1" max="24" value="${state.allocation}" ${editable()?'':'disabled'}></label><p>Потребность: ${state.demand} ч</p><p>Перегрузка: <strong>${overload()} ч</strong> · дефицит: <strong>${deficit()} ч</strong></p><div class="actions">${link('conflicts','Проверить конфликты →')}</div></div></div>`,
 gantt:()=>`<div class="card"><h2>Гант проекта</h2><div class="scroll"><div class="gantt"><div>Работа / октябрь</div><div>05 пн</div><div>06 вт</div><div>07 ср</div><div>08 чт</div><div>09 пт</div><div>Интерфейс</div><div class="task" style="grid-column:span 2">${state.demand} ч · FEATURE</div><div></div><div></div><div></div><div>Приёмка</div><div style="grid-column:span 5">◆ ${escape(state.date)} · веха</div></div></div><p class="muted">Визуальная демонстрация. Расчёт рабочего календаря и FS выполняет будущий сервер.</p></div>`,
 conflicts:()=>`<div class="card"><h2>${overload()||deficit()?'Нужно уточнить ресурсы':'Блокирующих конфликтов нет'}</h2><p>${overload()?`Назначено ${state.allocation} ч при доступных ${state.availability} ч: перегрузка ${overload()} ч.`:'Перегрузка: 0 ч.'}</p><p>Дефицит потребности: ${deficit()} ч. ${state.allocation>state.demand?'Есть превышение назначения над потребностью.':''}</p><p>Для демо переключитесь на R-04, установите доступность 6 ч и подтвердите назначение. Затем R-02 отправляет план на согласование.</p><div class="actions">${link('resources','Исправить ресурсы →')} ${link('approval','Перейти к согласованию →')}</div></div>`,
 scenarios:()=>`<div class="grid two"><div class="card"><h2>Действующая baseline</h2><p>${state.baseline?`Версия ${state.baseline.version} · ${state.baseline.demand} ч · веха ${escape(state.baseline.date)}`:'Пока нет. Сначала утвердите и активируйте первоначальный план.'}</p><span class="badge good">Содержимое не редактируется</span></div><div class="card"><h2>Вариант «Что если»</h2><p>Копия сохраняет связь с исходной версией. Изменения не затрагивают baseline.</p>${button('scenario','Создать сценарий',true,!state.baseline||!['R-02','R-03'].includes(state.role)||state.scenario&&state.status==='DRAFT')}<label class="field">Веха сценария<input id="scenario-date" type="date" min="2026-10-05" max="2026-12-31" value="${escape(state.date)}" ${state.scenario&&editable()?'':'disabled'}></label><p>${state.scenario&&state.baseline?`Вариант V${state.version}: ${state.date===state.baseline.date?'срок не изменён':'срок изменён, требуется новое согласование'}`:''}</p>${link('approval','Согласовать вариант →')}</div></div>`,
 approval:()=>`<div class="card"><div class="steps">${['DRAFT','ON_REVIEW','APPROVED','ACTIVE'].map(x=>`<span class="step ${x===state.status?'done':''}">${x}</span>`).join('')}</div><h2 style="margin-top:24px">Решение по версии ${state.version}</h2><p>Раунд ${state.reviewRound} · перегрузка ${overload()} ч · дефицит ${deficit()} ч · ресурсы ${state.confirmed?'подтверждены':'не подтверждены'}.</p><p class="muted">Отправка: R-02/R-03. Финальное решение и активация: R-01. Возврат открывает новый цикл редактирования.</p><div class="actions">${button('submit','Отправить на согласование',true,!editable()||!state.confirmed||overload()>0||deficit()>0||state.allocation>state.demand)}${button('approve','Утвердить',true,state.role!=='R-01'||state.status!=='ON_REVIEW')}${button('return','Вернуть на доработку',false,state.role!=='R-01'||state.status!=='ON_REVIEW')}${button('activate','Активировать',true,state.role!=='R-01'||state.status!=='APPROVED')}</div><label class="field">Комментарий для возврата<input id="return-comment" placeholder="Укажите причину"></label></div>`,
 calendar:()=>`<div class="card"><h2>Мои назначения</h2><p>Демо-сотрудник · рабочая неделя 05–09 октября</p><div class="grid"><div class="card"><h3>Понедельник · 05</h3><div class="stat">${state.baseline?state.baseline.allocation:0} ч</div><p>ERP-A · Интерфейс</p></div><div class="card"><h3>Вторник · 06</h3><div class="stat">0 ч</div><p>Назначений нет</p></div><div class="card"><h3>Оповещения</h3><p>${state.baseline?'Опубликована версия V'+state.baseline.version:'Активного плана ещё нет'}</p></div></div><p class="muted">Показаны назначения активной baseline. Факт работы вводится в Task Tracker.</p></div>`,
 attachments:()=>`<div class="card"><h2>Обоснования проекта</h2><p>В прототипе добавляется демонстрационная карточка; файл никуда не загружается.</p>${state.attachment?'<p><strong>justification.txt</strong> · 12 байт · AVAILABLE (демо)</p>':'<p class="muted">Вложений пока нет.</p>'}<div class="actions">${['R-02','R-03'].includes(state.role)?button('attachment','Добавить демо-вложение',true,state.attachment):''}</div></div>`,
 forecast:()=>`<div class="grid"><div class="card"><div class="eyebrow">Факт</div><div class="stat">12 ч</div><p>Абсолютный срез Task Tracker (демо)</p></div><div class="card"><div class="eyebrow">Остаток ETC</div><div class="stat">8 ч</div><p>Явная оценка планировщика</p></div><div class="card"><div class="eyebrow">Полная трудоёмкость</div><div class="stat">20 ч</div><p>Факт + ETC</p></div></div><div class="card"><h2>Качество прогноза <span class="badge bad">PARTIAL</span></h2><p>Нет подтверждённой ставки. Денежный итог не рассчитан. Арифметический остаток задачи не подменяет оценку будущей работы.</p>${link('scenarios','Создать сценарий по отклонению →')}</div>`,
 exchange:()=>`<div class="card"><h2>Публикация плана · Task Tracker</h2><p>Состояние: <strong>${state.publication}</strong> (демо)</p><p>Ключ: ERP-A / версия ${state.baseline?.version||1}. Ответ приёмника моделируется.</p>${button('retry','Повторить доставку',true,state.publication==='SUCCEEDED'||!state.baseline)}<p class="muted">Повтор не меняет baseline и сохраняет ключ. Без активного плана отправка недоступна.</p></div><div class="card"><h2>Журнал действий</h2><div class="timeline">${state.events.slice(-10).map(x=>`<p>${escape(x)}</p>`).join('')}</div></div>`
};$('content').innerHTML=cards[screen]();bindFields()}
function bindFields(){for(const[id,field,allowed]of [['demand-hours','demand',editable],['allocation-hours','allocation',editable],['available-hours','availability',()=>state.role==='R-04'&&state.status==='DRAFT']])if($(id))$(id).onchange=e=>{if(!allowed())return;const n=Number(e.target.value);if(!Number.isFinite(n)||n<(field==='availability'?0:1)||n>24){toast('Введите часы в допустимом диапазоне');render();return}state[field]=n;state.confirmed=false;change('Изменены часы: '+n)};if($('project-name'))$('project-name').onchange=e=>{if(!editable())return;const name=e.target.value.trim();if(!name){toast('Название не может быть пустым');render();return}state.name=name;change('Изменено название черновика')};if($('scenario-date'))$('scenario-date').onchange=e=>{if(!editable()||!state.scenario)return;if(e.target.value<'2026-10-05'||e.target.value>'2026-12-31'){toast('Дата должна быть внутри горизонта');render();return}state.date=e.target.value;state.confirmed=false;change('Изменена веха сценария')};}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='normal'){mode='normal';render()}if(a==='confirm-resource'&&state.role==='R-04'&&state.status==='DRAFT'&&!overload()&&!deficit()&&state.allocation<=state.demand){state.confirmed=true;change('Ресурсы подтверждены')}if(a==='submit'&&editable()&&state.confirmed&&!overload()&&!deficit()&&state.allocation<=state.demand){state.status='ON_REVIEW';state.reviewRound++;change('Версия отправлена на согласование')}if(a==='approve'&&state.role==='R-01'&&state.status==='ON_REVIEW'){state.status='APPROVED';change('Версия утверждена; содержимое заморожено')}if(a==='return'&&state.role==='R-01'&&state.status==='ON_REVIEW'){const comment=$('return-comment').value.trim();if(!comment)return toast('Укажите причину возврата');state.status='DRAFT';change('Возврат: '+comment)}if(a==='activate'&&state.role==='R-01'&&state.status==='APPROVED')confirmAction('Активировать план?',`Версия ${state.version} станет действующей. Прежняя baseline будет замещена.`,()=>{state.status='ACTIVE';state.baseline={version:state.version,demand:state.demand,allocation:state.allocation,date:state.date};state.publication='FAILED';change('Активирована версия '+state.version)});if(a==='scenario'&&state.baseline&&['R-02','R-03'].includes(state.role)){state.scenario=true;state.version++;state.status='DRAFT';state.confirmed=false;change('Создан изолированный сценарий')}if(a==='attachment'&&['R-02','R-03'].includes(state.role)){state.attachment=true;change('Добавлена демо-карточка вложения')}if(a==='retry'&&state.role==='R-06'&&state.baseline){state.publication='SUCCEEDED';change('Получено демонстрационное подтверждение; ключ сохранён')}});
$('role').onchange=e=>{state.role=e.target.value;mode='normal';save();render()};$('reset').onclick=()=>confirmAction('Сбросить демонстрацию?','Локальные изменения прототипа будут заменены исходным примером.',()=>{state=initial();mode='normal';screen='portfolio';location.hash='portfolio';save('Демо сброшено');render()});window.addEventListener('hashchange',()=>{screen=location.hash.slice(1);mode='normal';render();$('main').focus()});render();
</script></body></html>
