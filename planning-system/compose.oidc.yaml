# Isolated local OIDC demonstration. Shared environments require HTTPS and Infra clients.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - ./dev/keycloak-realm.json:/opt/keycloak/data/import/planning.json:ro
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
  api:
    environment:
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:8081/realms/planning
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/planning/.well-known/openid-configuration
      OIDC_JWKS_URL: http://keycloak:8080/realms/planning/protocol/openid-connect/certs
      OIDC_AUDIENCE: planning-api
      OIDC_CLIENT_ID: planning-web
      OIDC_LOCAL_HTTP: "true"
    depends_on:
      keycloak: {condition: service_healthy}
