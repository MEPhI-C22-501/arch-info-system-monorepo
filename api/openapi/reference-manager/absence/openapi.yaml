openapi: 3.1.0

# generated by tools/gencatalog from the catalog definition, do not edit by hand

info:
  title: Reference Manager Absence API
  description: "Absences of employees: vacations, sick leaves and other periods. Readable by the HR roles only."
  version: 1.0.0

security:
  - KeycloakOAuth2: []

paths:
  /v1/absences/:
    post:
      operationId: createAbsence
      summary: Create a new absence
      description: Creates a absence with revision number 1.
      x-required-roles: [reference-hr-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Absence'
      responses:
        '201':
          $ref: '#/components/responses/SuccessWithExpandedAbsence'
        '400':
          description: Bad Request. Invalid input data, validation errors with details per field, or a malformed request body.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to create a absence.
          $ref: '#/components/responses/Error'
        '409':
          description: Conflict. A absence with the same unique values already exists.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

    get:
      operationId: listAbsences
      x-required-roles: [reference-hr-reader, reference-hr-admin]
      summary: List absences with pagination
      parameters:
        - $ref: '#/components/parameters/ListPageSize'
        - $ref: '#/components/parameters/ListPageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/AllowDeleted'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedAbsences'
        '400':
          description: Bad Request. Invalid filter, ordering or page token.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to read absences.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

  /v1/absences/export:
    post:
      operationId: exportAbsences
      summary: Export absences in Excel format
      description: Generates and returns an Excel file with all active absences in creation order.
      x-required-roles: [reference-hr-reader, reference-hr-admin]
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExcelFile'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to export absences.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

  /v1/absences/{absenceID}:
    get:
      operationId: getAbsence
      x-required-roles: [reference-hr-reader, reference-hr-admin]
      summary: Get a absence by ID
      description: Returns the current state of the absence with its revision metadata.
      parameters:
        - $ref: '#/components/parameters/AbsenceID'
        - $ref: '#/components/parameters/AllowDeleted'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedAbsence'
        '400':
          description: Bad Request. Invalid identifier or query parameters.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to read absences.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The absence does not exist or is deleted and deleted records were not allowed.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

    patch:
      operationId: updateAbsence
      summary: Update a absence
      description: Partially updates the absence, only the fields of the update mask change. A new revision records the difference.
      parameters:
        - $ref: '#/components/parameters/AbsenceID'
        - $ref: '#/components/parameters/UpdateMask'
      x-required-roles: [reference-hr-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Absence'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedAbsence'
        '400':
          description: Bad Request. Invalid input data, validation errors with details per field, or a malformed update mask.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to update absences.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The absence does not exist or is deleted.
          $ref: '#/components/responses/Error'
        '409':
          description: Conflict. Unique values are taken, or the absence was modified concurrently.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

    delete:
      operationId: deleteAbsence
      summary: Delete a absence
      description: >
        Soft-deletes the absence: the record is marked as deleted and a new revision is created.
        With `force=true` the record is permanently deleted together with its revision history.
      parameters:
        - $ref: '#/components/parameters/AbsenceID'
        - $ref: '#/components/parameters/Force'
      x-required-roles: [reference-hr-admin]
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithExpandedAbsence'
        '204':
          description: No Content. The absence has been permanently deleted with `force=true`.
        '400':
          description: Bad Request. Invalid identifier or query parameters.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to delete absences.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The absence does not exist or has already been deleted.
          $ref: '#/components/responses/Error'
        '409':
          description: Conflict. The absence was modified concurrently.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

  /v1/absences/{absenceID}/revisions:
    get:
      operationId: listAbsenceRevisions
      x-required-roles: [reference-hr-reader, reference-hr-admin]
      summary: List the revisions of a absence
      description: Returns the revision history of the absence page by page.
      parameters:
        - $ref: '#/components/parameters/AbsenceID'
        - $ref: '#/components/parameters/ListPageSize'
        - $ref: '#/components/parameters/ListPageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/AllowDeleted'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithAbsenceRevisionList'
        '400':
          description: Bad Request. Invalid query parameters, pagination errors, or malformed filters.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to read absences.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The absence does not exist.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

  /v1/absences/{absenceID}/revisions/{revisionNumber}:
    get:
      operationId: getAbsenceRevision
      x-required-roles: [reference-hr-reader, reference-hr-admin]
      summary: Get a revision of a absence
      description: Returns one revision of the absence with the changes it applied.
      parameters:
        - $ref: '#/components/parameters/AbsenceID'
        - $ref: '#/components/parameters/RevisionNumber'
        - $ref: '#/components/parameters/AllowDeleted'
      responses:
        '200':
          $ref: '#/components/responses/SuccessWithAbsenceRevision'
        '400':
          description: Bad Request. Invalid identifier or revision number.
          $ref: '#/components/responses/Error'
        '401':
          description: Unauthorized. Missing, invalid, or expired authentication credentials.
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden. The client lacks the role required to read absences.
          $ref: '#/components/responses/Error'
        '404':
          description: Not Found. The absence or the revision does not exist.
          $ref: '#/components/responses/Error'
        '500':
          description: Internal Server Error.
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    KeycloakOAuth2:
      type: oauth2
      description: >
        Authentication via Keycloak (OAuth 2.0 / OpenID Connect), realm arch-info-system.
        Pass the access token in the Authorization header (Bearer <token>). The token has to be issued
        for the reference-manager audience. Access is granted by the realm roles (or the roles of the
        reference-manager client) listed in x-required-roles of each operation, any of them is enough.
        A request without a valid token gets 401, a token without a required role gets 403.
        The URLs below point to the local environment.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8180/realms/arch-info-system/protocol/openid-connect/auth
          tokenUrl: http://localhost:8180/realms/arch-info-system/protocol/openid-connect/token
          scopes: {}
        clientCredentials:
          tokenUrl: http://localhost:8180/realms/arch-info-system/protocol/openid-connect/token
          scopes: {}

  schemas:
    Error:
      type: object
      description: Standardized error response format for all API errors.
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error message describing what went wrong.
          example: "validation failed"
        details:
          type: array
          description: Optional field-specific errors.
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      description: Detailed information about a specific error or validation issue.
      properties:
        field:
          type: string
          description: The field name that caused the error (if applicable).
          example: "code"
        message:
          type: string
          description: Specific error message for this field or detail.
          example: "must match ^[a-z][a-z0-9-]{1,63}$"

    AbsenceKind:
      type: string
      description: "Kind of the absence."
      enum:
        - VACATION
        - SICK_LEAVE
        - OTHER

    Absence:
      type: object
      description: The fields of a absence a client sets on creation and update.
      required:
        - employee_id
        - kind
        - start_date
        - end_date
      properties:
        employee_id:
          type: integer
          format: int64
          minimum: 1
          description: "Identifier of the employee, cannot be changed after creation."
          example: 1
        kind:
          $ref: '#/components/schemas/AbsenceKind'
        start_date:
          type: string
          format: date
          description: "First day of the absence."
          example: "2026-07-06"
        end_date:
          type: string
          format: date
          description: "Last day of the absence, not earlier than the first day."
          example: "2026-07-19"

    ExpandedAbsence:
      type: object
      description: A absence with its identifier and the lifecycle derived from its revisions.
      required:
        - id
        - employee_id
        - kind
        - start_date
        - end_date
        - is_deleted
        - revision
        - last_changer
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          type: integer
          format: int64
          description: Identifier of the absence, assigned by the service.
          example: 1
        employee_id:
          type: integer
          format: int64
          minimum: 1
          description: "Identifier of the employee, cannot be changed after creation."
          example: 1
        kind:
          $ref: '#/components/schemas/AbsenceKind'
        start_date:
          type: string
          format: date
          description: "First day of the absence."
          example: "2026-07-06"
        end_date:
          type: string
          format: date
          description: "Last day of the absence, not earlier than the first day."
          example: "2026-07-19"
        is_deleted:
          type: boolean
          description: Indicates whether the record has been soft-deleted.
          example: false
        revision:
          type: integer
          format: int32
          description: The sequential number of the latest revision applied to this record.
          example: 1
        last_changer:
          type: string
          format: uuid
          description: UUID of the user or system component that performed the latest change.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        created_at:
          type: string
          format: date-time
          description: The date and time when the record was created.
          example: "2026-10-05T07:54:00Z"
        updated_at:
          type: string
          format: date-time
          description: The date and time when the record was last changed.
          example: "2026-10-05T07:54:00Z"
        deleted_at:
          type: string
          format: date-time
          description: The date and time of the soft deletion, the zero time (0001-01-01T00:00:00Z) if the record has never been deleted.
          example: "0001-01-01T00:00:00Z"

    AbsenceRevision:
      type: object
      description: One change of a absence. This model is read-only.
      required:
        - id
        - absence_id
        - revision_number
        - change
        - changed_by
        - changed_at
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the revision record.
          readOnly: true
          example: 1024
        absence_id:
          type: integer
          format: int64
          description: Identifier of the absence this revision belongs to.
          readOnly: true
          example: 1
        revision_number:
          type: integer
          format: int32
          description: The sequential number of the revision, starting from 1.
          readOnly: true
          example: 3
        change:
          type: array
          description: Changes applied in this revision relative to the previous one, formatted as a JSON Patch (RFC 6902).
          readOnly: true
          items:
            type: object
        changed_by:
          type: string
          format: uuid
          description: UUID of the user or system component that performed the change.
          readOnly: true
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        changed_at:
          type: string
          format: date-time
          description: The date and time when the change was applied.
          readOnly: true
          example: "2026-10-05T07:54:00Z"

  parameters:
    AbsenceID:
      name: absenceID
      in: path
      description: Identifier of the absence, a positive integer.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

    ListPageSize:
      name: pageSize
      in: query
      description: Number of elements per page.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
        example: 50

    ListPageToken:
      name: pageToken
      in: query
      description: Pagination token from the previous response.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: "^[a-zA-Z0-9_-]+$"

    UpdateMask:
      name: updateMask
      in: query
      required: false
      description: >
        Comma-separated list of the fields to update. If the parameter is omitted or set to `*`,
        all updatable fields passed in the request body are updated.
      schema:
        type: string
        example: "name"

    Force:
      name: force
      in: query
      required: false
      description: If set to `true`, the record is permanently deleted together with its revisions.
      schema:
        type: boolean
        default: false

    AllowDeleted:
      name: allowDeleted
      in: query
      required: false
      description: If set to `true`, soft-deleted records are included.
      schema:
        type: boolean
        default: false

    Filter:
      name: filter
      in: query
      required: false
      description: >
        An AIP-160 expression for filtering results. It supports comparison operators (=, !=, <, >, <=, >=),
        logical operators (AND, OR, NOT) and containment checks (`name : "team"`). Dates are compared as `YYYY-MM-DD` strings.
      schema:
        type: string
        example: 'is_deleted = false'

    OrderBy:
      name: order_by
      in: query
      required: false
      description: >
        A comma-separated list of sort fields. Ascending order is used by default. To change the direction,
        use the `desc` suffix (e.g., `created_at desc, id`).
      schema:
        type: string
        example: 'created_at desc'

    RevisionNumber:
      name: revisionNumber
      in: path
      description: The sequential number of the revision, starting from 1.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 3

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    SuccessWithExpandedAbsence:
      description: Successful response with the expanded absence
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpandedAbsence'

    SuccessWithExpandedAbsences:
      description: Successful response with a page of expanded absences
      content:
        application/json:
          schema:
            type: object
            properties:
              absences:
                type: array
                description: Page of absences
                items:
                  $ref: '#/components/schemas/ExpandedAbsence'
              nextPageToken:
                type: string
                description: Token to retrieve the next page, absent on the last page
                example: "next_page_token_value"

    SuccessWithAbsenceRevision:
      description: Successful response with one revision of a absence
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbsenceRevision'

    SuccessWithAbsenceRevisionList:
      description: Successful response with a page of revisions of a absence
      content:
        application/json:
          schema:
            type: object
            properties:
              revisions:
                type: array
                description: Page of revisions
                items:
                  $ref: '#/components/schemas/AbsenceRevision'
              nextPageToken:
                type: string
                description: Token to retrieve the next page, absent on the last page
                example: "next_page_token_value"

    SuccessWithExcelFile:
      description: The file has been successfully generated and is ready for download.
      headers:
        Content-Disposition:
          schema:
            type: string
          example: 'attachment; filename="absences.xlsx"'
          description: Instructs the browser to download the file as an attachment with the given name.
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
