[project]
name = "arch-api"
version = "0.1.0"
description = "Generated clients for arch-info-system APIs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "python-dateutil>=2.8",
    "typing-extensions>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reference_manager"]
