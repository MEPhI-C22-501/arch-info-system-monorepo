version: '3'

vars:
  SPEC_DIR: '{{.ROOT_DIR}}/openapi/reference-manager/currency/v1'
  OUT_DIR: '{{.ROOT_DIR}}/out'
  NO_TESTS_AND_DOCS: modelTests=false,apiTests=false,modelDocs=false,apiDocs=false

tasks:
  generate:
    desc: Generate code from specifications for the target language (TARGET=go|python|java|typescript)
    requires:
      vars:
        - name: TARGET
          enum: [go, python, java, typescript]
    cmds:
      - task: generate:{{.TARGET}}

  generate:go:
    internal: true
    vars:
      MODULE_DIR: '{{.OUT_DIR}}/go'
      PACKAGE_DIR: '{{.MODULE_DIR}}/reference-manager/currency/v1'
    cmds:
      - rm -rf {{.PACKAGE_DIR}}
      - |
        openapi-generator-cli generate \
          -i {{.SPEC_DIR}}/openapi.yaml \
          -c {{.SPEC_DIR}}/config.go.yaml \
          -g go-server \
          -o {{.PACKAGE_DIR}} \
          --global-property=models,apis,supportingFiles=api.go:routers.go:helpers.go:error.go:logger.go:impl.go
      - rm -rf {{.PACKAGE_DIR}}/.openapi-generator
      - cd {{.MODULE_DIR}} && go mod tidy

  generate:python:
    internal: true
    vars:
      PROJECT_DIR: '{{.OUT_DIR}}/python'
      PACKAGE_DIR: '{{.PROJECT_DIR}}/reference_manager/currency/v1'
    cmds:
      - rm -rf {{.PACKAGE_DIR}}
      - |
        openapi-generator-cli generate \
          -i {{.SPEC_DIR}}/openapi.yaml \
          -c {{.SPEC_DIR}}/config.python.yaml \
          -g python \
          -o {{.PROJECT_DIR}} \
          --global-property=models,apis,{{.NO_TESTS_AND_DOCS}},supportingFiles=__init__.py:api_client.py:api_response.py:configuration.py:exceptions.py:rest.py
      - rm -rf {{.PROJECT_DIR}}/.openapi-generator

  generate:java:
    internal: true
    vars:
      PROJECT_DIR: '{{.OUT_DIR}}/java'
      PACKAGE_DIR: '{{.PROJECT_DIR}}/src/main/java/ru/mephi/arch/api/referencemanager/currency/v1'
    cmds:
      - rm -rf {{.PACKAGE_DIR}}
      - |
        openapi-generator-cli generate \
          -i {{.SPEC_DIR}}/openapi.yaml \
          -c {{.SPEC_DIR}}/config.java.yaml \
          -g java \
          -o {{.PROJECT_DIR}} \
          --global-property=models,apis,{{.NO_TESTS_AND_DOCS}},supportingFiles=ApiClient.java:ApiException.java:ApiResponse.java:Configuration.java:JSON.java:Pair.java:RFC3339DateFormat.java:RFC3339InstantDeserializer.java:RFC3339JavaTimeModule.java:ServerConfiguration.java:ServerVariable.java:AbstractOpenApiSchema.java
      - rm -rf {{.PROJECT_DIR}}/.openapi-generator
      # The generator creates directories for skipped supporting files (gradle/, .github/, api/)
      - find {{.PROJECT_DIR}} -type d -empty -delete

  generate:typescript:
    internal: true
    vars:
      PACKAGE_DIR: '{{.OUT_DIR}}/typescript/src/reference-manager/currency/v1'
    cmds:
      - rm -rf {{.PACKAGE_DIR}}
      - |
        openapi-generator-cli generate \
          -i {{.SPEC_DIR}}/openapi.yaml \
          -c {{.SPEC_DIR}}/config.typescript.yaml \
          -g typescript-fetch \
          -o {{.PACKAGE_DIR}} \
          --global-property=models,apis,{{.NO_TESTS_AND_DOCS}},supportingFiles=index.ts:runtime.ts
      - rm -rf {{.PACKAGE_DIR}}/.openapi-generator
      # Generated code has unused imports/params that break consumers built with noUnusedLocals/noUnusedParameters
      - |
        for f in $(find {{.PACKAGE_DIR}} -name '*.ts'); do
          { echo '// @ts-nocheck'; cat "$f"; } > "$f.tmp" && mv "$f.tmp" "$f"
        done
