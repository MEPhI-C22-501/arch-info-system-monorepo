name: Planning System checks
on:
  pull_request:
    paths: ['planning-system/**', '.github/workflows/planning-system-checks.yaml']
  push:
    branches: [main]
    paths: ['planning-system/**', '.github/workflows/planning-system-checks.yaml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env: {POSTGRES_DB: planning_test, POSTGRES_USER: planning, POSTGRES_PASSWORD: planning_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U planning -d planning_test" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r planning-system/server/requirements.txt -r planning-system/scripts/requirements-docs.txt
      - run: python -m ruff check --select E9,F63,F7,F82 planning-system/server planning-system/tests
      - run: node --check planning-system/ui/app/app.js
      - run: python -m compileall -q planning-system/server
      - run: python planning-system/scripts/validate-docs.py
      - run: python -m pytest planning-system/tests -q --junitxml=planning-system/artifacts/tests.xml
        env:
          TEST_DATABASE_URL: postgresql+psycopg://planning:planning_test@localhost:5432/planning_test
      - run: docker compose -p planning-ci -f planning-system/compose.yaml up -d --build --wait api worker
      - run: npm install --prefix /tmp/planning-browser playwright@1.58.2
      - run: /tmp/planning-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node planning-system/scripts/check-app.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/planning-browser/node_modules/playwright/index.mjs
          APP_URL: http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-verification
          path: planning-system/artifacts/
      - run: docker compose -p planning-ci -f planning-system/compose.yaml down -v
        if: always()
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: planning-system/Dockerfile
          push: true
          tags: ghcr.io/mephi-c22-501/planning-system:${{ github.sha }}
      - run: echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
