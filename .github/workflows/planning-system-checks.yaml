name: Planning System checks
on:
  pull_request:
    paths: ['planning-system/**', '.github/workflows/planning-system-checks.yaml']
  push:
    branches: ['**']
    paths: ['planning-system/**', '.github/workflows/planning-system-checks.yaml']
  workflow_dispatch:
    inputs:
      minikube:
        description: Run local Kubernetes and PVC persistence smoke
        type: boolean
        default: false
concurrency:
  group: planning-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env: {POSTGRES_DB: planning_test, POSTGRES_USER: planning, POSTGRES_PASSWORD: planning_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U planning -d planning_test" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r planning-system/server/requirements.txt -r planning-system/scripts/requirements-docs.txt
      - run: python -m ruff check --select E9,F63,F7,F82 planning-system/server planning-system/tests
      - run: node --check planning-system/ui/app/app.js
      - run: python -m compileall -q planning-system/server
      - run: python planning-system/scripts/validate-docs.py
      - run: python planning-system/scripts/audit-traceability.py
      - run: |
          node planning-system/scripts/build-data-model.mjs
          node planning-system/scripts/build-contracts.mjs
          git diff --exit-code -- planning-system/docs/120.data-model.md planning-system/docs/130.api-contracts.md planning-system/docs/135.event-catalog.md planning-system/docs/140.event-schema.md planning-system/docs/contracts/
      - run: python -m pytest planning-system/tests -q --junitxml=planning-system/artifacts/tests.xml
        env:
          TEST_DATABASE_URL: postgresql+psycopg://planning:planning_test@localhost:5432/planning_test
      - run: docker compose -p planning-ci -f planning-system/compose.yaml up -d --build --wait api worker
      - run: npm install --prefix /tmp/planning-browser playwright@1.58.2 mermaid@11.12.0
      - run: /tmp/planning-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node planning-system/scripts/check-app.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/planning-browser/node_modules/playwright/index.mjs
          APP_URL: http://127.0.0.1:8080
      - run: python planning-system/scripts/check-restore.py --project planning-ci
      - run: node planning-system/scripts/check-prototype.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/planning-browser/node_modules/playwright/index.mjs
          MERMAID_BUNDLE: /tmp/planning-browser/node_modules/mermaid/dist/mermaid.min.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-verification
          path: planning-system/artifacts/
      - run: docker compose -p planning-ci -f planning-system/compose.yaml down -v
        if: always()
  minikube:
    if: github.event_name == 'workflow_dispatch' && inputs.minikube
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install httpx==0.28.1
      - run: |
          curl -fsSL https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64 -o /tmp/minikube
          curl -fsSL https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64.sha256 -o /tmp/minikube.sha256
          python -c "import hashlib; from pathlib import Path; assert hashlib.sha256(Path('/tmp/minikube').read_bytes()).hexdigest() == Path('/tmp/minikube.sha256').read_text().split()[0]"
          chmod +x /tmp/minikube
          /tmp/minikube start -p planning-ci --driver=docker --cpus=2 --memory=3072 --kubernetes-version=v1.34.0
          /tmp/minikube -p planning-ci addons enable ingress
          docker build -t planning-system:local -f planning-system/Dockerfile .
          /tmp/minikube -p planning-ci image load planning-system:local
          kubectl create namespace arch-planning-system
          kubectl -n arch-planning-system create secret generic planning-secret --from-literal=DB_PASSWORD=ci-fixture --from-literal=DATABASE_URL=postgresql+psycopg://planning:ci-fixture@postgres:5432/planning --from-literal=CURSOR_SECRET=ci-fixture-cursor-key-longer-than-32-chars
          kubectl apply -f planning-system/deploy/minikube/stand.yaml
          kubectl -n arch-planning-system wait --for=condition=complete job/planning-migrate --timeout=180s
          kubectl -n arch-planning-system rollout status deployment/planning-api --timeout=180s
          python planning-system/scripts/check-minikube.py --context planning-ci --restart --ingress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-minikube
          path: planning-system/artifacts/minikube-report.json
      - run: /tmp/minikube delete -p planning-ci
        if: always()
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: planning-system/Dockerfile
          push: true
          tags: ghcr.io/mephi-c22-501/planning-system:${{ github.sha }}
      - run: echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
