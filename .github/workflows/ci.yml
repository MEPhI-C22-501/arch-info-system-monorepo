name: CI

on:
  pull_request:
    paths:
      - infra/**
      - compose.yaml
      - compose.dev.yaml
      - compose.examples.yaml
      - compose.modules.yaml
      - .env.example
      - .github/workflows/ci.yml
      - .github/workflows/infra-checks.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - compose.yaml
      - compose.dev.yaml
      - compose.examples.yaml
      - compose.modules.yaml
      - .env.example
      - .github/workflows/ci.yml
      - .github/workflows/infra-checks.yml

permissions:
  contents: read

jobs:
  infra:
    uses: ./.github/workflows/infra-checks.yml
