name: Reference Manager PR Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

    branches:
      - main

    paths:
      - 'reference-manager/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reference-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: reference-manager/go.mod
          cache-dependency-path: reference-manager/go.sum

      - name: Install development tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run linters checks
        run: task lint

  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reference-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Docker image
        run: task build

  tests:
    name: Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reference-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: reference-manager/go.mod
          cache-dependency-path: reference-manager/go.sum

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: task tests