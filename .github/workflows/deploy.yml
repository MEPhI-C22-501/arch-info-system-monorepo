name: Deploy

# Внешний хост не подключён. Workflow проверяет манифест выпуска и не получает секреты публикации.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate release manifest
        run: |
          python3 -m pip install --user PyYAML==6.0.3
          python3 infra/scripts/validate-release.py
      - name: External deploy
        run: |
          echo "Площадка, TLS и runner стенда не заданы. Доставка наружу не выполняется."
          exit 0
