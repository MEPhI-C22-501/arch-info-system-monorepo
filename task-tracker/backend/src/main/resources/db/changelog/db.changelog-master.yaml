databaseChangeLog:
  - changeSet:
      id: 001-initial
      author: task-tracker
      changes:
        - sqlFile:
            path: db/changelog/001-initial.sql
            splitStatements: true
  - changeSet:
      id: 002-review
      author: task-tracker
      changes:
        - sqlFile:
            path: db/changelog/002-review.sql
            splitStatements: false
