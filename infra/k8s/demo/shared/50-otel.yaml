# Общие сервисы: otel. Секреты создаются скриптом вне Git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    arch-demo: 'true'
  namespace: arch-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        arch-demo: 'true'
    spec:
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.149.0
        args:
        - --config=file:/etc/otel/collector.yaml
        ports:
        - name: grpc
          containerPort: 4317
        - name: http
          containerPort: 4318
        readinessProbe:
          tcpSocket:
            port: grpc
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - name: config
          mountPath: /etc/otel
        - name: data
          mountPath: /var/lib/otel
      volumes:
      - name: config
        configMap:
          name: otel-config
      - name: data
        emptyDir: {}
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    arch-demo: 'true'
  namespace: arch-infra
spec:
  selector:
    app: otel-collector
  ports:
  - name: grpc
    port: 4317
  - name: http
    port: 4318
