# Общие сервисы: minio. Секреты создаются скриптом вне Git.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    arch-demo: 'true'
  namespace: arch-infra
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        arch-demo: 'true'
    spec:
      containers:
      - name: minio
        image: arch-info-minio:RELEASE.2025-10-15T17-29-55Z
        args:
        - server
        - /data
        - --console-address
        - :9001
        ports:
        - name: api
          containerPort: 9000
        - name: console
          containerPort: 9001
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: arch-infra-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: arch-infra-secrets
              key: MINIO_ROOT_PASSWORD
        readinessProbe:
          httpGet:
            path: /minio/health/live
            port: api
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: '1'
            memory: 384Mi
        volumeMounts:
        - name: data
          mountPath: /data
        imagePullPolicy: IfNotPresent
      securityContext:
        fsGroup: 1000
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    arch-demo: 'true'
  namespace: arch-infra
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
  - name: console
    port: 9001
