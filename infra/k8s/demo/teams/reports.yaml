# Команда reports: миграция, backend, frontend, Services и ETL. БД находится в arch-infra.
# Job запускает миграцию один раз и завершается.
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-migrate
  labels:
    arch-demo: 'true'
  namespace: arch-reports
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app: demo-migrate
        arch-demo: 'true'
    spec:
      restartPolicy: Never
      containers:
      - name: demo-migrate
        image: arch-info-demo:local
        imagePullPolicy: IfNotPresent
        command:
        - python
        - app.py
        - migrate
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: DATABASE_URL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 192Mi
---
# Deployment поддерживает указанное количество pod приложения (replicas).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    arch-demo: 'true'
  namespace: arch-reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        arch-demo: 'true'
    spec:
      containers:
      - name: backend
        image: arch-info-demo:local
        imagePullPolicy: IfNotPresent
        env:
        - name: TEAM
          value: reports
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: DATABASE_URL
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: S3_SECRET_KEY
        - name: KC_EXAMPLE_CALLER_SECRET
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: KC_EXAMPLE_CALLER_SECRET
        - name: KAFKA_EXAMPLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: KAFKA_EXAMPLE_PASSWORD
        - name: S3_ENDPOINT
          value: http://minio.arch-infra.svc.cluster.local:9000
        - name: S3_BUCKET
          value: arch-dev-reports
        - name: S3_ACCESS_KEY
          value: reports
        - name: KEYCLOAK_URL
          value: http://keycloak.arch-infra.svc.cluster.local:8080
        - name: ROLE
          value: api
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 192Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          periodSeconds: 10
        volumeMounts:
        - name: ca
          mountPath: /kafka
          readOnly: true
      volumes:
      - name: ca
        configMap:
          name: demo-kafka-ca
---
# Service даёт pod постоянное DNS-имя и направляет запросы по selector.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    arch-demo: 'true'
  namespace: arch-reports
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
---
# Deployment поддерживает указанное количество pod приложения (replicas).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    arch-demo: 'true'
  namespace: arch-reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        arch-demo: 'true'
    spec:
      containers:
      - name: frontend
        image: arch-info-demo:local
        imagePullPolicy: IfNotPresent
        env:
        - name: TEAM
          value: reports
        - name: ROLE
          value: frontend
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 192Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          periodSeconds: 10
---
# Service даёт pod постоянное DNS-имя и направляет запросы по selector.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    arch-demo: 'true'
  namespace: arch-reports
spec:
  selector:
    app: frontend
  ports:
  - port: 8080
    targetPort: 8080
---
# CronJob запускает ETL по расписанию schedule.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-etl
  namespace: arch-reports
  labels:
    arch-demo: 'true'
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 360
      template:
        metadata:
          labels:
            app: demo-etl
            arch-demo: 'true'
        spec:
          restartPolicy: Never
          containers:
          - name: demo-etl
            image: arch-info-demo:local
            imagePullPolicy: IfNotPresent
            command:
            - python
            - app.py
            - etl
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: demo-secrets
                  key: DATABASE_URL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 500m
                memory: 192Mi
