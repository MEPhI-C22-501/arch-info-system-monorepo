# Команда task-tracker: PostgreSQL с диском, миграция, backend, frontend и Services.
# StatefulSet поддерживает PostgreSQL; volumeClaimTemplates создаёт постоянный диск (PVC).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    arch-demo: 'true'
  namespace: arch-task-tracker
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        arch-demo: 'true'
    spec:
      containers:
      - name: postgres
        image: postgres:18.6
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: demo
        - name: POSTGRES_USER
          value: demo
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: 30m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - demo
            - -d
            - demo
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
# Service даёт pod постоянное DNS-имя и направляет запросы по selector.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    arch-demo: 'true'
  namespace: arch-task-tracker
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
# Job запускает миграцию один раз и завершается.
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-migrate
  labels:
    arch-demo: 'true'
  namespace: arch-task-tracker
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app: demo-migrate
        arch-demo: 'true'
    spec:
      restartPolicy: Never
      containers:
      - name: demo-migrate
        image: arch-info-demo:local
        imagePullPolicy: IfNotPresent
        command:
        - python
        - app.py
        - migrate
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: DATABASE_URL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 192Mi
---
# Deployment поддерживает указанное количество pod приложения (replicas).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    arch-demo: 'true'
  namespace: arch-task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        arch-demo: 'true'
    spec:
      containers:
      - name: backend
        image: arch-info-demo:local
        imagePullPolicy: IfNotPresent
        env:
        - name: TEAM
          value: task-tracker
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: DATABASE_URL
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: S3_SECRET_KEY
        - name: KC_EXAMPLE_CALLER_SECRET
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: KC_EXAMPLE_CALLER_SECRET
        - name: KAFKA_EXAMPLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: KAFKA_EXAMPLE_PASSWORD
        - name: S3_ENDPOINT
          value: http://minio.arch-infra.svc.cluster.local:9000
        - name: S3_BUCKET
          value: arch-dev-task-tracker
        - name: S3_ACCESS_KEY
          value: task-tracker
        - name: KEYCLOAK_URL
          value: http://keycloak.arch-infra.svc.cluster.local:8080
        - name: ROLE
          value: api
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 192Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          periodSeconds: 10
        volumeMounts:
        - name: ca
          mountPath: /kafka
          readOnly: true
      volumes:
      - name: ca
        configMap:
          name: demo-kafka-ca
---
# Service даёт pod постоянное DNS-имя и направляет запросы по selector.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    arch-demo: 'true'
  namespace: arch-task-tracker
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
---
# Deployment поддерживает указанное количество pod приложения (replicas).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    arch-demo: 'true'
  namespace: arch-task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        arch-demo: 'true'
    spec:
      containers:
      - name: frontend
        image: arch-info-demo:local
        imagePullPolicy: IfNotPresent
        env:
        - name: TEAM
          value: task-tracker
        - name: ROLE
          value: frontend
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 192Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          periodSeconds: 10
---
# Service даёт pod постоянное DNS-имя и направляет запросы по selector.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    arch-demo: 'true'
  namespace: arch-task-tracker
spec:
  selector:
    app: frontend
  ports:
  - port: 8080
    targetPort: 8080
